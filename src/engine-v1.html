<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF1F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1222" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Command Center">
<title>Lineup Command Center</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: one fluid column under a large collapsing title, a lineup-health ring as the hero,
   league plates as quiet rows, and a floating glass dock with the Crystal Ball at its center. */
:root{
  --field:#EEF1F8; --plate:#FFFFFF; --plate-2:#F3F5FB; --hair:rgba(22,34,78,.10); --hair-2:rgba(22,34,78,.16);
  --ink:#0E1630; --ink-2:#56618A; --ink-3:#8B94B0;
  --signal:#5B47F0; --signal-ink:#FFFFFF; --cyan:#0A9FBC;
  --crit:#E0424F; --warn:#C97A06; --up:#2A78E4; --ok:#18975F; --info:#6B7590;
  --glass:rgba(250,251,255,.74); --shadow:0 10px 30px rgba(20,30,70,.14),0 2px 6px rgba(20,30,70,.08);
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --orb1:#7B5CFF; --orb2:#3CC4D6; --orb3:#F2A9E8; --scrim:rgba(8,12,26,.62);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --field:#0C1222; --plate:#141C30; --plate-2:#1B2540; --hair:rgba(160,180,240,.10); --hair-2:rgba(160,180,240,.18);
  --ink:#E8EDFB; --ink-2:#9AA5C4; --ink-3:#6B7695;
  --signal:#9384FF; --signal-ink:#0D0A2B; --cyan:#45D3E6;
  --crit:#FF6B78; --warn:#FFB547; --up:#5CB3FF; --ok:#3DDB98; --info:#8D97B5;
  --glass:rgba(18,25,46,.72); --shadow:0 14px 40px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --field:#0C1222; --plate:#141C30; --plate-2:#1B2540; --hair:rgba(160,180,240,.10); --hair-2:rgba(160,180,240,.18);
  --ink:#E8EDFB; --ink-2:#9AA5C4; --ink-3:#6B7695;
  --signal:#9384FF; --signal-ink:#0D0A2B; --cyan:#45D3E6;
  --crit:#FF6B78; --warn:#FFB547; --up:#5CB3FF; --ok:#3DDB98; --info:#8D97B5;
  --glass:rgba(18,25,46,.72); --shadow:0 14px 40px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.3); color-scheme:dark}
/* names older render code still uses */
:root{--bg:var(--field);--surface:var(--plate);--sunk:var(--plate-2);--line:var(--hair);--muted:var(--ink-2);--accent:var(--signal);--accent-ink:var(--signal-ink);
  --crit-bg:color-mix(in srgb,var(--crit) 15%,transparent);--warn-bg:color-mix(in srgb,var(--warn) 16%,transparent);
  --up-bg:color-mix(in srgb,var(--up) 15%,transparent);--ok-bg:color-mix(in srgb,var(--ok) 15%,transparent)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--field);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--signal)}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:10px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px}
.num{font-variant-numeric:tabular-nums;font-weight:600}
@media (hover:none){button:active,.ghost:active,a.ghost:active{transform:scale(.97)}}
button,.ghost{transition:transform .15s var(--ease),background-color .2s,border-color .2s,color .2s}

/* Top bar with a large title that tucks in on scroll */
.topbar{position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(var(--field) 55%,color-mix(in srgb,var(--field) 0%,transparent));view-transition-name:topbar}
.topbar.scrolled{background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 1px 0 var(--hair)}
.hrow{display:flex;align-items:flex-end;gap:10px;padding-block:14px 12px;transition:padding .25s var(--ease)}
.topbar.scrolled .hrow{padding-block:8px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-family:var(--display);font-weight:600;font-size:28px;line-height:1.05;letter-spacing:-.01em;transition:font-size .25s var(--ease)}
.topbar.scrolled .brand h1{font-size:19px}
.brand small{display:block;color:var(--ink-2);font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s,height .2s}
.topbar.scrolled .brand small{opacity:0;height:0;margin:0}
.wk{display:flex;align-items:center;height:38px;border-radius:999px;background:var(--plate);box-shadow:inset 0 0 0 1px var(--hair)}
.wk button{background:none;border:0;width:34px;height:38px;font-size:18px;color:var(--ink-2);border-radius:999px}
.wk span{font-weight:600;font-size:14px;min-width:44px;text-align:center}
.iconbtn{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:0;background:var(--plate);box-shadow:inset 0 0 0 1px var(--hair);color:var(--ink-2);padding:0}
.iconbtn svg{width:18px;height:18px}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{padding-block:6px calc(120px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;view-transition-name:page}
.status{font-size:13px;color:var(--ink-2);display:flex;gap:4px 10px;align-items:center;flex-wrap:wrap}
.status .num{color:var(--ink)}
.live{display:inline-flex;align-items:center;gap:8px}.live i{width:8px;height:8px;border-radius:50%;background:var(--signal);animation:pulse .9s ease-in-out infinite alternate}
.bar{height:3px;background:var(--plate-2);border-radius:3px;overflow:hidden;flex-basis:100%}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--orb1),var(--orb2));width:0;transition:width .3s var(--ease)}

/* Floating dock */
.dock{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;width:min(calc(100% - 24px),460px);height:66px;
  display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;border-radius:26px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);
  box-shadow:var(--shadow),inset 0 0 0 1px var(--hair-2);view-transition-name:dock}
.dock button{background:none;border:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-size:11px;font-weight:600;position:relative;z-index:1;border-radius:20px}
.dock button svg{width:22px;height:22px}
.dock button[aria-current="page"]{color:var(--ink)}
.dock .ind{position:absolute;top:8px;left:0;width:var(--w,60px);height:50px;border-radius:18px;background:color-mix(in srgb,var(--signal) 14%,transparent);transform:translateX(var(--x,0));transition:transform .4s var(--ease),width .4s var(--ease),opacity .2s;pointer-events:none}
.dock .orbslot{display:flex;justify-content:center}
.orbbtn{width:60px!important;height:60px!important;margin-top:-26px;border-radius:50%!important;padding:0!important;filter:drop-shadow(0 8px 16px rgba(70,50,190,.45))}
.orbbtn .orb{width:60px;height:60px}

/* Hero: lineup health ring */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:4px 0 2px}
.ring{position:relative;width:148px;height:148px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .ctr b{font-family:var(--display);font-weight:600;font-size:40px;line-height:1;letter-spacing:-.02em}
.ring .ctr span{font-size:12px;color:var(--ink-2);margin-top:4px;max-width:96px;line-height:1.25}
.ring .sweep{animation:sweep 1.1s var(--ease) both}
@keyframes sweep{from{stroke-dashoffset:var(--c)}to{stroke-dashoffset:0}}
.legend{display:flex;flex-direction:column;gap:4px;min-width:0}
.legend button{display:grid;grid-template-columns:10px 2.2em 1fr;align-items:center;gap:10px;background:none;border:0;padding:7px 10px;border-radius:12px;text-align:left;font-size:14px;color:var(--ink-2)}
.legend button i{width:10px;height:10px;border-radius:50%;background:var(--sev)}
.legend button b{font-weight:700;color:var(--ink);font-size:16px}
.legend button[aria-pressed="true"]{background:var(--plate);box-shadow:inset 0 0 0 1px var(--hair-2);color:var(--ink)}
.legend .k-crit{--sev:var(--crit)} .legend .k-warn{--sev:var(--warn)} .legend .k-up{--sev:var(--up)} .legend .k-ok{--sev:var(--ok)}
@media (max-width:360px){.hero{grid-template-columns:1fr;justify-items:center}.legend{width:100%}}

/* Segmented control */
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);padding:4px;border-radius:14px;background:var(--plate-2);box-shadow:inset 0 0 0 1px var(--hair)}
.seg button{position:relative;z-index:1;background:none;border:0;height:34px;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button[aria-selected="true"]{color:var(--ink)}
.seg i{position:absolute;top:4px;left:4px;bottom:4px;width:calc((100% - 8px)/var(--n));border-radius:10px;background:var(--plate);box-shadow:0 1px 3px rgba(0,0,0,.12),inset 0 0 0 1px var(--hair);transform:translateX(calc(var(--i)*100%));transition:transform .35s var(--ease)}

/* Setup */
.setup{background:var(--plate);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 0 0 1px var(--hair)}
.setup h2{font-family:var(--display);font-weight:600;font-size:24px;margin:0;line-height:1.15}
.setup p{margin:0;color:var(--ink-2);max-width:60ch}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;height:48px;border:0;border-radius:14px;background:var(--plate-2);box-shadow:inset 0 0 0 1px var(--hair);padding:0 14px;font-size:16px}
.primary{height:48px;border:0;border-radius:14px;background:var(--signal);color:var(--signal-ink);font-weight:700;padding:0 20px}

/* Plates (league cards) */
.card{background:var(--plate);border-radius:22px;box-shadow:inset 0 0 0 1px var(--hair);overflow:hidden;position:relative;--sev:var(--ink-3)}
.card.s-crit{--sev:var(--crit)} .card.s-warn{--sev:var(--warn)} .card.s-up{--sev:var(--up)} .card.s-ok{--sev:var(--ok)} .card.s-info{--sev:var(--info)}
.card.done{opacity:.5}
.chead{display:flex;gap:12px;align-items:flex-start;padding:16px 16px 10px}
.chead .t{flex:1;min-width:0}
.card .chead .lname::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sev);margin:0 9px 2px 0;box-shadow:0 0 0 4px color-mix(in srgb,var(--sev) 18%,transparent);vertical-align:middle}
.lname{font-weight:650;font-size:16px;line-height:1.3;overflow-wrap:anywhere;letter-spacing:-.005em}
.meta{font-size:12.5px;color:var(--ink-2);display:flex;gap:4px 12px;flex-wrap:wrap;margin-top:4px}
.score{text-align:right;font-size:12px;color:var(--ink-2);white-space:nowrap}
.score .num{display:block;font-size:15px;color:var(--ink)}
.issues{list-style:none;margin:0;padding:0 16px 12px;display:flex;flex-direction:column;gap:8px}
.issue{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.45}
.pill{flex:none;font-size:11.5px;font-weight:650;border-radius:999px;padding:2px 9px;margin-top:1px;--c:var(--info);background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.p-crit{--c:var(--crit)} .p-warn{--c:var(--warn)} .p-up{--c:var(--up)} .p-info{--c:var(--info)} .p-ok{--c:var(--ok)}
.issue .txt{min-width:0;overflow-wrap:anywhere}
.issue .nm{font-weight:650}
.moves{margin:0 12px 12px;border-radius:16px;background:var(--plate-2);padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;font-size:14px;align-items:baseline}
.moves .lab{font-size:12px;font-weight:700}
.moves .in{color:var(--ok)} .moves .out{color:var(--crit)}
.moves .pos{font-size:12px;color:var(--ink-3)}
.moves .gain{grid-column:1/-1;font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--hair);padding-top:6px;margin-top:2px}
.cfoot{display:flex;gap:8px;padding:2px 16px 16px;flex-wrap:wrap}
.ghost{display:inline-flex;align-items:center;gap:6px;background:none;border:0;box-shadow:inset 0 0 0 1px var(--hair-2);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;text-decoration:none;color:var(--ink)}
.ghost.on{background:var(--ok-bg);box-shadow:none;color:var(--ok)}
.ghost.go{background:var(--signal);box-shadow:none;color:var(--signal-ink)}
.ghost.back{align-self:flex-start}

/* Tables */
.lineup{margin:0 16px 14px;overflow-x:auto}
.lineup table,.mini{width:100%;border-collapse:collapse;font-size:13.5px}
.lineup th,.mini th{font-size:12px;color:var(--ink-3);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--hair)}
.lineup td,.mini td{padding:7px 8px;border-bottom:1px solid var(--hair);vertical-align:top}
.lineup td.slot{font-weight:700;font-size:12px;color:var(--ink-3);white-space:nowrap}
.lineup tr.chg td{background:var(--up-bg)}
.lineup .pr{text-align:right;white-space:nowrap}
.mini tr.me td{font-weight:650;background:color-mix(in srgb,var(--signal) 12%,transparent)}
.tag{font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.t-Q{background:var(--warn-bg);color:var(--warn)} .t-X{background:var(--crit-bg);color:var(--crit)} .t-L{background:var(--plate-2);color:var(--ink-3)}

/* Lists */
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:none;border:0;width:100%;text-align:left}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--sev,var(--hair-2));box-shadow:0 0 0 4px color-mix(in srgb,var(--sev,transparent) 16%,transparent)}
.row .lname{flex:1;font-weight:600;font-size:15px}
.search{height:48px;border:0;border-radius:16px;background:var(--plate);box-shadow:inset 0 0 0 1px var(--hair-2);padding:0 16px;font-size:16px;width:100%}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px;scroll-padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chips .chip{flex:none}
.cbsheet .chips{margin-inline:0;padding-inline:0;flex-wrap:wrap}
.chip{border:0;background:var(--plate);box-shadow:inset 0 0 0 1px var(--hair-2);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--field);box-shadow:none}
.plist{background:var(--plate);border-radius:22px;box-shadow:inset 0 0 0 1px var(--hair);overflow:hidden}
.plist > div + div{border-top:1px solid var(--hair)}
.prow{padding:14px 16px}
.prow + .prow{border-top:1px solid var(--hair)}
.ptop{display:flex;gap:10px;align-items:baseline}
.ptop .nm{flex:1;font-weight:650;min-width:0}
.ptop .pos{font-size:12.5px;color:var(--ink-3)}
.pstat{font-size:13px;color:var(--ink-2);margin-top:3px}
.pleagues{margin:8px 0 0;padding:0;list-style:none;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.pleagues li{display:flex;gap:10px}
.pleagues li span:first-child{flex:1;min-width:0;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--ink-2);padding:36px 16px;border-radius:22px;background:var(--plate-2)}
.err{background:var(--crit-bg);color:var(--crit);border-radius:16px;padding:14px 16px;font-size:14px}
.note{font-size:12.5px;color:var(--ink-2);max-width:65ch}
details.settings{background:var(--plate);border-radius:22px;padding:14px 16px;box-shadow:inset 0 0 0 1px var(--hair)}
details.settings summary{cursor:pointer;font-weight:600}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;font-size:14px}
.srow select,.srow input[type=text]{height:38px;border:0;border-radius:12px;background:var(--plate-2);box-shadow:inset 0 0 0 1px var(--hair);padding:0 10px;min-width:0}

/* Section intros: open text, no plate */
.summary{display:flex;flex-direction:column;gap:12px;padding:6px 2px 2px}
.summary h3{margin:0;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.01em}
.summary p{margin:0;font-size:14px;color:var(--ink-2);max-width:62ch}
.summary .plist{margin-top:2px}

/* Today strip */
.today{display:flex;gap:14px;align-items:center;justify-content:space-between;border-radius:20px;padding:14px 16px;
  background:linear-gradient(120deg,color-mix(in srgb,var(--orb1) 16%,var(--plate)),color-mix(in srgb,var(--orb2) 12%,var(--plate)));box-shadow:inset 0 0 0 1px var(--hair)}
.today div{display:flex;flex-direction:column;gap:2px;min-width:0}
.today b{font-weight:700;font-size:15px}
.today span{font-size:13.5px;color:var(--ink-2)}
.today .ghost{flex:none;background:var(--plate)}

/* Blueprints */
.grades{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.gchip{display:flex;align-items:center;gap:7px;border-radius:12px;padding:3px 4px 3px 10px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--plate-2)}
.gchip b{font-family:var(--display);font-weight:600;font-size:13px;line-height:1;border-radius:8px;padding:5px 7px}
.g-A,.g-B{background:var(--ok-bg);color:var(--ok)} .g-C{background:var(--plate);color:var(--ink)} .g-D{background:var(--warn-bg);color:var(--warn)} .g-F{background:var(--crit-bg);color:var(--crit)}
.bpline{font-size:13px;color:var(--ink-2);padding:0 16px 12px}
.map{margin:0 12px 12px;background:var(--plate-2);border-radius:16px;padding:8px}
.map svg{display:block;width:100%;height:auto}

/* Direction */
.callout{background:var(--warn-bg);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:13.5px!important}
.oddsrow{display:flex;gap:6px 16px;flex-wrap:wrap;padding:0 16px 8px;font-size:12.5px;color:var(--ink-2)}
.oddsrow b{font-size:16px;color:var(--ink)}
.verdict .vlabel{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.05;letter-spacing:-.02em;color:var(--sev);padding:0 16px}
.verdict .vline{margin:8px 16px 14px;font-size:14.5px}
.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px 14px}
.odds div{background:var(--plate-2);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.odds b{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.1;letter-spacing:-.02em}
.odds span{font-size:12px;color:var(--ink-2);font-weight:600}
.odds .hot{background:var(--warn-bg)} .odds .hot b{color:var(--warn)}
.why{margin:0;padding:0 16px 16px;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13.5px}
.why dt{font-size:12px;font-weight:650;color:var(--ink-3);padding-top:1px}
.why dd{margin:0;min-width:0;overflow-wrap:anywhere}
.impact{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 12px 12px}
.impact div{background:var(--plate-2);border-radius:14px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:2px;min-width:0}
.impact b{font-size:12px;font-weight:650;color:var(--ink-3);margin-bottom:2px}
.dup{color:var(--ok);font-weight:650} .ddn{color:var(--crit);font-weight:650}
.pitch{margin:0 12px 12px;border-radius:14px;padding:10px 12px;font-size:13.5px;background:var(--plate-2)}
.pitch summary{cursor:pointer;font-weight:600}
.pitch p{margin:8px 0 0}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:10px}
@media (max-width:420px){.impact{grid-template-columns:1fr}.verdict .vlabel{font-size:28px}.odds b{font-size:19px}}

/* Crystal Ball */
.orb{position:relative;display:block;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 32% 28%,#fff 0 6%,rgba(255,255,255,.35) 7% 14%,transparent 15%),radial-gradient(circle at 50% 60%,#2B1D6B,#120B33 70%);box-shadow:inset 0 0 18px rgba(170,150,255,.55),0 0 0 2px rgba(180,170,255,.35)}
.orb.big{width:180px;height:180px}
.orb i{position:absolute;border-radius:50%;filter:blur(10px);opacity:.75;mix-blend-mode:screen;animation:swirl 3.2s linear infinite}
.orb i:nth-child(1){width:70%;height:55%;left:5%;top:30%;background:var(--orb1)}
.orb i:nth-child(2){width:55%;height:50%;left:40%;top:20%;background:var(--orb2);animation-duration:2.4s;animation-direction:reverse}
.orb i:nth-child(3){width:45%;height:40%;left:25%;top:50%;background:var(--orb3);animation-duration:4s}
.orb.big i{filter:blur(22px);animation-duration:1.1s}
.orb.big i:nth-child(2){animation-duration:.8s}
.orb.big b{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.6),transparent 60%);animation:pulse .6s ease-in-out infinite alternate}
@keyframes swirl{from{transform:rotate(0deg) translateX(6%) rotate(0deg)}to{transform:rotate(360deg) translateX(6%) rotate(-360deg)}}
@keyframes pulse{from{opacity:.15;transform:scale(.7)}to{opacity:.55;transform:scale(1.05)}}
.cb{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;justify-content:center;align-items:flex-end;animation:fade .2s ease-out}
.cbsheet{background:var(--field);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:28px 28px 0 0;padding:8px 16px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);animation:rise .38s var(--ease)}
.cbsheet > *{flex:none}
.askbtn{width:100%}
.cbsheet::before{content:"";align-self:center;width:40px;height:5px;border-radius:3px;background:var(--hair-2);flex:none;margin-bottom:2px}
@keyframes rise{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.cbhead{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-8px;background:var(--field);padding-block:6px;z-index:2}
.cbhead h2{margin:0;font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.01em}
.cbbox{background:var(--plate);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 1px var(--hair)}
.cbbox label,.cblab{font-size:13px;font-weight:650;color:var(--ink-2)}
.cbbox select{height:44px;border:0;border-radius:12px;background:var(--plate-2);box-shadow:inset 0 0 0 1px var(--hair);padding:0 10px;width:100%}
.sel{display:flex;gap:6px;flex-wrap:wrap}
.sel .chip{background:var(--signal);color:var(--signal-ink);box-shadow:none}
.pick{display:flex;gap:6px;flex-wrap:wrap;max-height:140px;overflow-y:auto}
.pick .chip small{color:var(--ink-3);margin-left:5px;font-weight:500}
.askbtn{height:52px;border:0;border-radius:16px;background:linear-gradient(100deg,var(--orb1),var(--orb2));color:#fff;font-weight:700;font-size:16px;box-shadow:0 8px 20px rgba(91,71,240,.35)}
.askbtn:disabled{opacity:.35;box-shadow:none}
.cbfog{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle at 50% 45%,rgba(60,40,140,.6),rgba(6,8,20,.94) 65%);color:#fff;cursor:pointer;animation:fade .2s ease-out}
.cbfog p{margin:0;font-family:var(--display);font-weight:500;font-size:20px}
.cbfog small{opacity:.6}
.answer{background:var(--plate);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;animation:reveal .4s var(--ease);box-shadow:inset 0 0 0 1px var(--hair)}
@keyframes reveal{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.answer .q{font-size:13px;color:var(--ink-2)}
.answer .v{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.15;letter-spacing:-.01em}
.conf{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.conf .meter{flex:1;height:8px;border-radius:4px;background:var(--plate-2);overflow:hidden}
.conf .meter i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--orb1),var(--orb2))}
.answer ul{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:5px}
.answer .flip{font-size:13.5px;background:var(--plate-2);border-radius:14px;padding:10px 12px}

/* Stat strip, explainers, skeletons */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--plate);border-radius:18px;padding:12px;box-shadow:inset 0 0 0 1px var(--hair);display:flex;flex-direction:column;gap:4px;min-width:0}
.stats b{font-family:var(--display);font-weight:600;font-size:26px;line-height:1;letter-spacing:-.02em}
.stats span{font-size:12.5px;color:var(--ink-2);line-height:1.3}
.explain{font-size:13.5px;color:var(--ink-2)}
.explain summary{cursor:pointer;font-weight:600;color:var(--ink)}
.explain p{margin:8px 0 0;max-width:62ch}
.skel{display:flex;flex-direction:column;gap:14px}
.skel i{display:block;height:132px;border-radius:22px;background:linear-gradient(100deg,var(--plate) 30%,var(--plate-2) 50%,var(--plate) 70%);background-size:300% 100%;animation:shimmer 1.4s linear infinite}
.skel i:nth-child(2){height:104px}.skel i:nth-child(3){height:150px}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
/* Page transitions */
::view-transition-old(page){animation:.14s ease-out both vt-out}
::view-transition-new(page){animation:.32s var(--ease) both vt-in}
@keyframes vt-out{to{opacity:0}}
@keyframes vt-in{from{opacity:0;transform:translateY(10px)}}

/* Wider screens: a little more air */
@media (min-width:760px){.brand h1{font-size:32px}main{gap:16px}.ring{width:168px;height:168px}}
@media (prefers-reduced-motion:reduce){*,::view-transition-old(page),::view-transition-new(page){animation:none!important;transition:none!important}}

<script>
"use strict";
const API = "https://api.sleeper.app";
const OUT_STATUSES = new Set(["Out","IR","PUP","Sus","NA","DNR","COV"]);
const FACTOR = {Out:0, IR:0, PUP:0, Sus:0, NA:0, DNR:0, COV:0, Doubtful:0.2, Questionable:0.85};
const SLOT_ELIG = {QB:["QB"],RB:["RB"],WR:["WR"],TE:["TE"],K:["K"],DEF:["DEF"],FLEX:["RB","WR","TE"],
  WRRB_FLEX:["RB","WR"],REC_FLEX:["WR","TE"],SUPER_FLEX:["QB","RB","WR","TE"],DL:["DL"],LB:["LB"],DB:["DB"],IDP_FLEX:["DL","LB","DB"]};
const SLOT_LABEL = {SUPER_FLEX:"SFLX",FLEX:"FLEX",WRRB_FLEX:"W/R",REC_FLEX:"W/T",IDP_FLEX:"IDP"};
const SKIP_STAT = /^(adp_|pos_adp_|pts_std$|pts_ppr$|pts_half_ppr$|gp$|cmp_pct$|rec_tgt$)/;
const SEV_RANK = {crit:0,warn:1,up:2,info:3,ok:4,off:5};

/* ---------- storage (per-device conveniences) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("cc:"+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("cc:"+k, JSON.stringify(v)); }catch(e){} }
};

const S = {
  username: store.get("username",""),
  threshold: store.get("threshold", 1.5),
  hideDone: store.get("hideDone", false),
  tab: "queue", filter: null, playerFilter: "all", query: "",
  season: null, nflWeek: null, week: null, userId: null, displayName: "",
  leagues: [], results: [], proj: {}, sched: {}, loading: false, progress: 0, error: null, loadedAt: null,
  expanded: new Set(), fc: {}, bp: null, bpLoading: false, bpError: null, bpProgress: 0, bpArch: null
};

/* ---------- fetch helpers ---------- */
const DATA_CACHE = "cc-data-v1";
let FAST = false;               // true while rendering the first screen from cached data
async function cacheGet(url){ try{ const c = await caches.open(DATA_CACHE); const m = await c.match(url); return m ? m.json() : null; }catch(e){ return null; } }
async function cachePut(url, data){ try{ const c = await caches.open(DATA_CACHE); await c.put(url, new Response(JSON.stringify(data), {headers:{"content-type":"application/json","x-saved":String(Date.now())}})); }catch(e){} }
// opts.cache: "prefer" = use a saved copy if there is one; "only" = never touch the network
async function getJSON(path, opts={}){
  const url = path.startsWith("http") ? path : API + path;
  const mode = opts.cache || (FAST ? "prefer" : "network");
  if(mode !== "network"){ const hit = await cacheGet(url); if(hit != null) return hit; if(mode === "only") throw new Error("not cached"); }
  const r = await fetch(url);
  if(!r.ok) throw new Error("Sleeper returned " + r.status + " for " + url.replace(API,"").split("?")[0]);
  const data = await r.json();
  cachePut(url, data);
  return data;
}
async function pool(items, n, fn){
  const out = new Array(items.length); let i = 0;
  async function worker(){ while(i < items.length){ const k = i++; try{ out[k] = await fn(items[k], k); }catch(e){ out[k] = {error:String(e.message||e)}; } } }
  await Promise.all(Array.from({length:Math.min(n, items.length)}, worker));
  return out;
}

/* ---------- scoring ---------- */
function leagueScore(stats, sc, pos){
  if(!stats) return 0;
  let t = 0;
  for(const k in stats){ if(SKIP_STAT.test(k)) continue; const w = sc[k]; if(w) t += w * stats[k]; }
  // kickers: projections use 50+ buckets that some leagues split into 50-59 / 60+
  if(stats.fgm_50p && sc.fgm_50p == null && sc.fgm_50_59) t += sc.fgm_50_59 * stats.fgm_50p;
  const rec = stats.rec || 0;
  if(rec){
    if(pos==="TE" && sc.bonus_rec_te && stats.bonus_rec_te==null) t += sc.bonus_rec_te*rec;
    if(pos==="WR" && sc.bonus_rec_wr && stats.bonus_rec_wr==null) t += sc.bonus_rec_wr*rec;
    if(pos==="RB" && sc.bonus_rec_rb && stats.bonus_rec_rb==null) t += sc.bonus_rec_rb*rec;
  }
  return t;
}

/* ---------- schedule ---------- */
function weekdayOf(date){ if(!date) return ""; const d = new Date(date+"T12:00:00"); return d.toLocaleDateString(undefined,{weekday:"short"}); }
function buildSched(all, week){
  const byTeam = {};
  for(const g of all){ if(g.week !== week) continue;
    for(const t of [g.home, g.away]) byTeam[t] = {date:g.date, status:g.status, opp: t===g.home ? g.away : "@"+g.home};
  }
  return byTeam;
}

/* ---------- player info per league ---------- */
function pinfo(pid, league){
  if(!pid || pid === "0") return null;
  const e = S.proj[pid]; const p = e && e.player || {};
  const pos = p.position || (isNaN(+pid) ? "DEF" : "?");
  const team = p.team || (isNaN(+pid) ? pid : null);
  const name = p.first_name ? (pos==="DEF" ? (p.last_name || p.first_name) : p.first_name[0] + ". " + p.last_name) : (pos==="DEF" ? pid + " D/ST" : "Player " + pid);
  const full = p.first_name ? (p.first_name + " " + (p.last_name||"")).trim() : name;
  const g = team ? S.sched[team] : null;
  const status = p.injury_status || null;
  let reason = null;
  if(!team) reason = "Not on an NFL team";
  else if(!g) reason = "Bye week";
  else if(g.status === "canceled") reason = "Game canceled";
  const locked = !!(g && (g.status === "complete" || g.status === "in_game"));
  const raw = e && e.stats ? leagueScore(e.stats, league.scoring_settings || {}, pos) : 0;
  let eff = raw * (status && FACTOR[status] != null ? FACTOR[status] : 1);
  if(reason) eff = 0;
  return {pid, name, full, pos, elig: p.fantasy_positions && p.fantasy_positions.length ? p.fantasy_positions : [pos], team, status, reason, locked, raw, eff, game:g};
}

/* ---------- optimizer ---------- */
function optimize(slots, current, poolIds, info){
  const assign = new Array(slots.length).fill(null); const used = new Set();
  slots.forEach((s,i)=>{ const p = current[i]; if(p && p!=="0" && info(p) && info(p).locked){ assign[i]=p; used.add(p); } });
  const cands = poolIds.filter(p=>!used.has(p) && info(p) && !info(p).locked);
  const order = slots.map((s,i)=>i).filter(i=>assign[i]===null)
    .sort((a,b)=>(SLOT_ELIG[slots[a]]||[]).length - (SLOT_ELIG[slots[b]]||[]).length);
  for(const i of order){
    const elig = SLOT_ELIG[slots[i]]; if(!elig){ assign[i] = current[i] && current[i]!=="0" ? current[i] : null; if(assign[i]) used.add(assign[i]); continue; }
    let best = null, bestV = -1;
    for(const p of cands){ if(used.has(p)) continue; const f = info(p); if(!f.elig.some(x=>elig.includes(x))) continue;
      const v = f.eff + (p === current[i] ? 0.001 : 0);
      if(v > bestV){ bestV = v; best = p; } }
    if(best){ assign[i] = best; used.add(best); }
  }
  return assign;
}

/* ---------- analyze one league ---------- */
function analyze(league, roster, matchups){
  const res = {league, roster, issues:[], sev:"ok", moves:null, gain:0, firstGame:null};
  const info = pid => pid && pid!=="0" ? (res._c[pid] ||= pinfo(pid, league)) : null; res._c = {};
  const set = league.settings || {};
  if(league.status !== "in_season"){ res.sev = "off"; res.issues.push({sev:"info", text: "League is " + (league.status||"not active").replace(/_/g," ")}); return res; }
  if(set.best_ball === 1){ res.sev = "off"; res.bestBall = true; res.issues.push({sev:"info", text:"Best ball — Sleeper sets this lineup for you"}); return res; }
  if(!roster){ res.sev = "off"; res.issues.push({sev:"info", text:"No team found for you in this league"}); return res; }

  const slots = league.roster_positions.filter(p=>p!=="BN");
  const current = (roster.starters || []).slice(0, slots.length);
  while(current.length < slots.length) current.push("0");
  const reserve = new Set(roster.reserve || []), taxi = new Set(roster.taxi || []);
  const active = (roster.players || []).filter(p=>!reserve.has(p) && !taxi.has(p));
  res.slots = slots; res.current = current;
  const autoSubs = set.max_subs || 0;

  // starter checks
  current.forEach((pid,i)=>{
    const slot = SLOT_LABEL[slots[i]] || slots[i];
    if(!pid || pid==="0"){ res.issues.push({sev:"crit", text:`Empty ${slot} slot`}); return; }
    const f = info(pid); if(f.locked) return;
    const day = f.game ? weekdayOf(f.game.date) : "";
    if(f.reason) res.issues.push({sev:"crit", text:`${f.full} — ${f.reason.toLowerCase()}`, date: f.game && f.game.date});
    else if(OUT_STATUSES.has(f.status)) res.issues.push({sev:"crit", text:`${f.full} is ${f.status === "IR" ? "on IR" : f.status}`, date:f.game.date});
    else if(f.status === "Doubtful") res.issues.push({sev:"crit", text:`${f.full} is Doubtful (${day})`, date:f.game.date});
    else if(f.status === "Questionable") res.issues.push({sev:"warn", text:`${f.full} is Questionable (${day}) · ${autoSubs ? `league allows ${autoSubs} auto-sub${autoSubs>1?"s":""}, set one in Sleeper` : "no auto-subs in this league"}`, date:f.game.date});
  });

  // optimal lineup
  const opt = optimize(slots, current, active, info);
  res.opt = opt;
  const total = arr => arr.reduce((s,p)=>s + (info(p) ? info(p).eff : 0), 0);
  const curT = total(current), optT = total(opt);
  res.projCur = curT; res.projOpt = optT; res.gain = optT - curT;
  const curSet = new Set(current), optSet = new Set(opt);
  const ins = opt.filter(p=>p && !curSet.has(p)), outs = current.filter(p=>p && p!=="0" && !optSet.has(p));
  const hasCrit = res.issues.some(x=>x.sev==="crit");
  if(ins.length && (res.gain >= S.threshold || hasCrit)){
    // pair each player coming in with the most natural player going out (same position first)
    const outsLeft = outs.map(info), pairedOuts = [];
    const insI = ins.map(info);
    for(const a of insI){
      let k = outsLeft.findIndex(b=>b.pos===a.pos);
      if(k < 0) k = outsLeft.findIndex(b=>b.elig.some(x=>a.elig.includes(x)));
      if(k < 0 && outsLeft.length) k = 0;
      pairedOuts.push(k >= 0 ? outsLeft.splice(k,1)[0] : null);
    }
    res.moves = {ins:insI, outs:pairedOuts.concat(outsLeft), gain:res.gain};
    if(!hasCrit) res.issues.push({sev:"up", text:`Better lineup available: +${res.gain.toFixed(1)} projected pts`});
  }
  if(hasCrit && !ins.length){
    const emptyFix = opt.some((p,i)=>!p);
    res.issues.push({sev:"crit", text: emptyFix ? "No eligible healthy player on the bench for an open slot. Check waivers." : "No healthy bench replacement. Check waivers."});
  }

  // IR slot: healthy player parked on IR
  for(const pid of reserve){ const f = info(pid); if(f && !f.reason && !f.status) res.issues.push({sev:"warn", text:`${f.full} is healthy but still in an IR slot. Sleeper blocks adds until he's moved.`}); }
  // open roster spots
  const open = league.roster_positions.length - active.length;
  if(open > 0) res.issues.push({sev:"info", text:`${open} open roster spot${open>1?"s":""}`});

  // matchup projection
  if(Array.isArray(matchups)){
    const me = matchups.find(m=>m.roster_id === roster.roster_id);
    const opp = me && me.matchup_id != null ? matchups.find(m=>m.matchup_id===me.matchup_id && m.roster_id!==roster.roster_id) : null;
    const side = (m, lineup) => { let s = 0; (lineup||[]).forEach((p,i)=>{ const f = info(p); if(!f) return;
      s += f.locked ? ((m.players_points||{})[p] || 0) : f.eff; }); return s; };
    if(me && opp){
      res.match = {me: side(me, current), meOpt: side(me, opt), opp: side(opp, opp.starters)};
      const z = (res.match.meOpt - res.match.opp) / 24;
      res.match.win = 1/(1+Math.exp(-1.7*z));
    }
  }
  const dates = res.issues.filter(x=>x.date).map(x=>x.date).sort();
  res.firstGame = dates[0] || null;
  res.sev = ["crit","warn","up","info"].find(s=>res.issues.some(x=>x.sev===s)) || "ok";
  if(res.sev === "info") res.sev = "ok";
  return res;
}

/* ---------- load ---------- */
async function loadAll(week, opts={}){
  const quiet = !!opts.quiet;
  FAST = !!opts.fast;
  if(quiet){ S.refreshing = true; renderStatus(); }
  else { S.loading = true; S.error = null; S.progress = 0; S.bp = null; S.fc = {}; S.wv = null; S.tf = null; S.dir = null; S.dirLid = null; render(); }
  try{
    if(!S.userId){
      const u = await getJSON("/v1/user/" + encodeURIComponent(S.username.trim()));
      if(!u || !u.user_id) throw new Error(`No Sleeper user named "${S.username}". Check the spelling.`);
      S.userId = u.user_id; S.displayName = u.display_name || u.username;
    }
    const st = await getJSON("/v1/state/nfl");
    S.season = st.season; S.nflWeek = st.week;

  const wasFast = FAST; FAST = false;
  S.loading = false; S.refreshing = false; render();

/* ---------- blueprints: dynasty team reviews for every league ---------- */
const FC_API = "https://api.fantasycalc.com/values/current";
const ARCH = {
  jugg:  {short:"Juggernaut", label:"Juggernaut", sev:"ok",   desc:"Strong now and later"},
  win:   {short:"Win-now", label:"Win-now",    sev:"up",   desc:"Contending, roster is aging"},
  rise:  {short:"Rising", label:"Rising",     sev:"up",   desc:"Middle of the pack, young core"},
  mid:   {short:"Middle", label:"Stuck in the middle", sev:"warn", desc:"Not contending, not young"},
  build: {short:"Rebuilding", label:"Rebuild on track", sev:"info", desc:"Weak now, strong future"},
  reset: {short:"Full rebuild", label:"Full rebuild needed", sev:"crit", desc:"Weak now and later"}
};
const ARCH_ORDER = ["jugg","win","rise","mid","build","reset"];
const nearest = (v, opts) => opts.reduce((a,b)=>Math.abs(b-v)<Math.abs(a-v)?b:a);
function fcKey(lg){
  const rp = lg.roster_positions||[];
  const q = (rp.includes("SUPER_FLEX") || rp.filter(p=>p==="QB").length>1) ? 2 : 1;
  return `${q}|${nearest(lg.total_rosters||12,[8,10,12,14])}|${nearest((lg.scoring_settings||{}).rec||0,[0,0.5,1])}`;
}
function fcValues(key){
  if(S.fc[key]) return S.fc[key];
  const [q,t,p] = key.split("|");
  S.fc[key] = getJSON(`${FC_API}?isDynasty=true&numQbs=${q}&numTeams=${t}&ppr=${p}`).then(arr=>{
    const players = {}, picks = {};
    for(const x of arr){ const pl = x.player;
      if(pl.position==="PICK") picks[pl.name] = x.value;
      else if(pl.sleeperId) players[pl.sleeperId] = {v:x.value, r:x.redraftValue||0, age:pl.maybeAge||null, pos:pl.position, name:pl.name, trend:x.trend30Day||0};
    }
    return {players, picks};
  });
  return S.fc[key];
}
function ageMult(pos, age){
  if(!age) return 0.95;
  if(pos==="RB") return age<=23?1.05:age<=25?0.95:age<=26?0.8:0.65;
  if(pos==="WR") return age<=24?1.05:age<=27?0.97:age<=29?0.85:0.7;
  if(pos==="TE") return age<=25?1.05:age<=29?0.97:0.8;
  if(pos==="QB") return age<=28?1.0:age<=33?0.95:0.75;
  return 0.9;
}
const isYoung = p => p.age && (p.pos==="RB"?p.age<=24:p.pos==="QB"?p.age<=27:p.age<=25);
const isOld = p => p.age && (p.pos==="RB"?p.age>=26:p.pos==="WR"?p.age>=28:p.pos==="TE"?p.age>=29:p.age>=32);
function posNeeds(lg){
  const rp = (lg.roster_positions||[]).filter(p=>p!=="BN"); const c = k=>rp.filter(p=>p===k).length;
  const fl = c("FLEX"), wr = c("WRRB_FLEX"), rec = c("REC_FLEX");
  return {QB: Math.max(1, c("QB")+c("SUPER_FLEX")), RB: Math.max(1, c("RB")+Math.round(fl*0.4+wr*0.5)),
          WR: Math.max(1, c("WR")+Math.round(fl*0.45+wr*0.5+rec*0.6)), TE: Math.max(1, c("TE")+Math.round(fl*0.15+rec*0.4))};
}
function winNowValue(lg, pl){
  const slots = (lg.roster_positions||[]).filter(p=>p!=="BN" && SLOT_ELIG[p]);
  const order = slots.slice().sort((a,b)=>SLOT_ELIG[a].length-SLOT_ELIG[b].length);
  const used = new Set(); let t = 0;
  for(const s of order){ let best=null;
    for(const p of pl){ if(used.has(p.id) || !SLOT_ELIG[s].includes(p.pos)) continue; if(!best || p.r>best.r) best=p; }
    if(best){ used.add(best.id); t += best.r; } }
  return {value:t, starters:used};
}
function pickLabel(p){ return `${p.season} ${["1st","2nd","3rd","4th","5th","6th"][p.round-1]||("R"+p.round)}${p.tier?` (${p.tier})`:""}`; }
function rankOf(arr, key, id){ const s = arr.slice().sort((a,b)=>b[key]-a[key]); return s.findIndex(x=>x.rid===id)+1; }
const grade = (r, n) => { const q = n>1 ? (r-1)/(n-1) : 0; return q<=0.15?"A":q<=0.4?"B":q<=0.65?"C":q<=0.85?"D":"F"; };
const ord = n => n + (["th","st","nd","rd"][((n%100)-20)%10] || ["th","st","nd","rd"][n%100] || "th");

function buildBlueprint(x, users, traded, fc){
  const lg = x.lg, N = x.rosters.length, season = +lg.season;
  const rounds = Math.min((lg.settings||{}).draft_rounds || 4, 6);
  const names = {}; for(const u of users||[]) names[u.user_id] = (u.metadata && u.metadata.team_name) || u.display_name || "Team";
  // pick ownership for the next three drafts
  const own = {}; x.rosters.forEach(r=>own[r.roster_id]=[]);
  const seasons = [season+1, season+2, season+3];
  const pickMap = {};
  for(const s of seasons) for(let rd=1; rd<=rounds; rd++) for(const r of x.rosters) pickMap[`${s}|${rd}|${r.roster_id}`] = r.roster_id;
  for(const t of traded||[]){ const k = `${t.season}|${t.round}|${t.roster_id}`; if(k in pickMap) pickMap[k] = t.owner_id; }
  // base profiles (players only) so next year's pick tiers can follow team strength
  const teams = x.rosters.map(r=>{
    const pl = (r.players||[]).map(id=>{ const v = fc.players[id]; return v ? {id, ...v} : null; }).filter(Boolean);
    const wn = winNowValue(lg, pl);
    return {rid:r.roster_id, owner:r.owner_id, name: names[r.owner_id] || `Team ${r.roster_id}`, roster:r, pl, now:wn.value, nowStarters:wn.starters,
            rec: r.settings ? `${r.settings.wins}-${r.settings.losses}${r.settings.ties?"-"+r.settings.ties:""}` : ""};
  });
  const nowSorted = teams.slice().sort((a,b)=>b.now-a.now);
  const tierOf = rid => { const k = nowSorted.findIndex(t=>t.rid===rid); return k < N/3 ? "Late" : k >= 2*N/3 ? "Early" : "Mid"; };
  for(const k in pickMap){ const [s, rd, orig] = k.split("|"); const ownerRid = pickMap[k];
    const tier = +s===season+1 && +rd<=4 ? tierOf(+orig) : null;
    const base = +rd<=4 ? (fc.picks[`${s} ${["1st","2nd","3rd","4th"][rd-1]}${tier?` (${tier})`:""}`] || fc.picks[`${s} ${["1st","2nd","3rd","4th"][rd-1]}`] || fc.picks[`${+s-1} ${["1st","2nd","3rd","4th"][rd-1]}`]*0.9 || 0)
                       : (fc.picks[`${s} 4th`] || 600) * 0.6;
    if(own[ownerRid]) own[ownerRid].push({season:+s, round:+rd, orig:+orig, tier, val:Math.round(base), mine:+orig===ownerRid});
  }
  const need = posNeeds(lg);
  for(const t of teams){
    t.picks = own[t.rid].sort((a,b)=>a.season-b.season||a.round-b.round);
    const pv = t.picks.reduce((s,p)=>s+p.val,0); t.pickVal = pv;
    t.dyn = t.pl.reduce((s,p)=>s+p.v,0) + pv;
    t.young = t.pl.filter(isYoung).reduce((s,p)=>s+p.v,0) + pv;
    t.y2 = t.pl.reduce((s,p)=>s+p.v*ageMult(p.pos,p.age)*ageMult(p.pos,p.age?p.age+1:null),0) + pv;
    const tot = t.pl.reduce((s,p)=>s+p.v,0) || 1;
    t.age = t.pl.reduce((s,p)=>s+(p.age||26)*p.v,0)/tot;
    t.pos = {};
    for(const pos of ["QB","RB","WR","TE"]) t.pos[pos] = t.pl.filter(p=>p.pos===pos).sort((a,b)=>b.v-a.v).slice(0,need[pos]).reduce((s,p)=>s+p.v,0);
  }
  for(const t of teams){
    t.nowRank = rankOf(teams,"now",t.rid); t.futRank = rankOf(teams,"young",t.rid);
    t.dynRank = rankOf(teams,"dyn",t.rid); t.y2Rank = rankOf(teams,"y2",t.rid);
    t.grades = {}; t.posRank = {};
    for(const pos of ["QB","RB","WR","TE"]){ const s = teams.slice().sort((a,b)=>b.pos[pos]-a.pos[pos]); t.posRank[pos] = s.findIndex(z=>z.rid===t.rid)+1; t.grades[pos] = grade(t.posRank[pos], N); }
    const nowTier = t.nowRank <= Math.ceil(N/3) ? "top" : t.nowRank > Math.floor(2*N/3) ? "bottom" : "mid";
    const futTop = t.futRank <= N/2;
    t.arch = nowTier==="top" ? (futTop?"jugg":"win") : nowTier==="mid" ? (futTop?"rise":"mid") : (futTop?"build":"reset");
  }
  const me = teams.find(t=>t.rid===x.mine.roster_id);
  me.strategy = strategy(me, teams, lg);
  return {lg, N, teams, me};
}
function strategy(me, teams, lg){
  const out = [];
  const contenders = teams.filter(t=>t.rid!==me.rid && ["jugg","win","rise"].includes(t.arch));
  const sellers = teams.filter(t=>t.rid!==me.rid && ["build","reset","mid"].includes(t.arch));
  const pos = ["QB","RB","WR","TE"];
  const weakest = pos.slice().sort((a,b)=>me.posRank[b]-me.posRank[a])[0];
  const strongest = pos.slice().sort((a,b)=>me.posRank[a]-me.posRank[b])[0];
  const partnerFor = (list, p, wantWeak) => list.slice().sort((a,b)=> wantWeak ? b.posRank[p]-a.posRank[p] : a.posRank[p]-b.posRank[p]).slice(0,2);
  if(["jugg","win"].includes(me.arch)){
    const targets = partnerFor(sellers, weakest, false).map(t=>{ const v = t.pl.filter(p=>p.pos===weakest && p.r>0).sort((a,b)=>b.r-a.r)[0]; return v ? `${v.name} (${t.name})` : null; }).filter(Boolean);
    out.push({kind:"buy", text:`Buy a ${weakest}: you're ${ord(me.posRank[weakest])} of ${teams.length} there.${targets.length?` Targets on non-contenders: ${targets.join(", ")}.`:""}`});
    const currency = me.picks.filter(p=>p.round<=2).slice(0,3).map(pickLabel)
      .concat(me.pl.filter(p=>!me.nowStarters.has(p.id) && isYoung(p)).sort((a,b)=>b.v-a.v).slice(0,2).map(p=>p.name));
    if(currency.length) out.push({kind:"pay", text:`Pay with assets that don't score for you this year: ${currency.join(", ")}.`});
    if(me.arch==="win"){ const aging = me.pl.filter(isOld).sort((a,b)=>b.v-a.v).slice(0,2).map(p=>`${p.name} (${p.age?Math.floor(p.age):"?"})`);
      if(aging.length) out.push({kind:"warn", text:`Your window is now. Plan to move ${aging.join(" and ")} by the offseason before age costs you value.`}); }
  } else if(["build","reset"].includes(me.arch)){
    const vets = me.pl.filter(p=>isOld(p) && p.r>1500).sort((a,b)=>b.r-a.r).slice(0,3);
    for(const v of vets){ const buyers = partnerFor(contenders, v.pos, true).map(t=>`${t.name} (${t.grades[v.pos]} at ${v.pos}, ${t.rec})`);
      out.push({kind:"sell", text:`Sell ${v.name} (${v.pos}, ${v.age?Math.floor(v.age):"?"})${buyers.length?` to a contender that needs a ${v.pos}: ${buyers.join(" or ")}`:""}.`}); }
    out.push({kind:"buy", text:`Collect ${me.arch==="reset"?"2027 firsts and players 24 and under":"young upside at "+weakest}. Your future value ranks ${ord(me.futRank)} of ${teams.length}.`});
  } else if(me.arch==="rise"){
    out.push({kind:"hold", text:`Hold the young core. Turn surplus at ${strongest} (${ord(me.posRank[strongest])}) into a starter at ${weakest} (${ord(me.posRank[weakest])}).`});
    const sell = me.pl.filter(isOld).sort((a,b)=>b.r-a.r).slice(0,2).map(p=>p.name);
    if(sell.length) out.push({kind:"sell", text:`Older pieces to shop to contenders: ${sell.join(", ")}.`});
  } else {
    const vets = me.pl.filter(p=>isOld(p) && p.r>1500).sort((a,b)=>b.r-a.r).slice(0,3).map(p=>p.name);
    out.push({kind:"warn", text:`Pick a lane: ${ord(me.nowRank)} now and ${ord(me.futRank)} in future value. Middle teams lose value every season.`});
    if(vets.length) out.push({kind:"sell", text:`To rebuild, start by selling ${vets.join(", ")} to contenders.`});
    out.push({kind:"buy", text:`To push now instead, your biggest hole is ${weakest} (${ord(me.posRank[weakest])} of ${teams.length}).`});
  }
  return out;
}
async function loadBlueprints(){
  if(S.bpLoading) return;

    const list = (S.raw||[]).filter(x=>!x.error && x.mine && x.rosters && x.lg.roster_positions && (x.mine.players||[]).length >= 8 && x.lg.status !== "pre_draft");

const erf = x => { const t = 1/(1+0.3275911*Math.abs(x)); const y = 1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x); return x>=0?y:-y; };
const Phi = z => 0.5*(1+erf(z/Math.SQRT2));

function rng(seed){ let a = seed>>>0; return ()=>{ a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1 | a); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14)>>>0) / 4294967296; }; }

// points per week in this league's scoring: average of this week and next (covers byes), discounted for injuries
const ROS_FACTOR = {IR:0, PUP:0, Sus:0, NA:0, DNR:0, COV:0.5, Out:0.6, Doubtful:0.8, Questionable:0.95};
function ppw(pid, lg, cache){
  if(cache[pid] != null) return cache[pid];
  let s = 0, n = 0, meta = null;
  for(const P of [S.proj, S.proj2 || {}]){ const e = P[pid]; if(!e) continue; meta = meta || e.player;
    if(!e.stats) continue; const v = leagueScore(e.stats, lg.scoring_settings || {}, (e.player||{}).position); if(v > 0.3){ s += v; n++; } }
  const p = meta || {}, st = p.injury_status, m = st && ROS_FACTOR[st] != null ? ROS_FACTOR[st] : 1;

}
function eligOf(pid){
  const p = ((S.proj[pid] || (S.proj2||{})[pid]) || {}).player || {};
  const pos = p.position || (isNaN(+pid) ? "DEF" : "?");
  return p.fantasy_positions && p.fantasy_positions.length ? p.fantasy_positions : [pos];

// best weekly lineup from a set of player ids
function lineupPts(lg, ids, cache){
  const slots = (lg.roster_positions||[]).filter(p=>p!=="BN" && SLOT_ELIG[p]).sort((a,b)=>SLOT_ELIG[a].length - SLOT_ELIG[b].length);
  const pl = [...new Set(ids)].map(id=>({id, elig:eligOf(id), v:ppw(id, lg, cache)})).sort((a,b)=>b.v-a.v);

async function seasonFor(b){

    return {rid:t.rid, bp:t, wins:(rs.wins||0) + 0.5*(rs.ties||0), pf, wk, proj:lu.pts, mean: wk ? w*(pf/wk) + (1-w)*lu.pts : lu.pts, ids, starters:lu.starters};
  });

// Monte Carlo: rest of the regular season, then the playoff bracket. adj = {teamIndex: change in weekly points}
function simulate(L, adj, n, seed){
  const r = rng(seed), T = L.teams, N = T.length, P = L.playoffTeams;
  const mean = T.map((t,i)=>t.mean + ((adj && adj[i]) || 0)), sd = mean.map(m=>0.16*Math.max(m,40) + 6);
  const po = new Float64Array(N), bub = new Float64Array(N), title = new Float64Array(N);
  const wins = new Float64Array(N), pf = new Float64Array(N), sc = new Float64Array(N), seedOf = new Int32Array(N);
  const ids = [...Array(N).keys()];
  for(let s = 0; s < n; s++){
    for(let i = 0; i < N; i++){ wins[i] = T[i].wins; pf[i] = T[i].pf; }
    for(const pairs of L.weeks){
      for(let i = 0; i < N; i++){ sc[i] = mean[i] + sd[i]*gauss(r); pf[i] += sc[i]; }
      let pr = pairs;
      if(!pr){ const sh = ids.slice(); for(let i = N-1; i > 0; i--){ const j = Math.floor(r()*(i+1)); [sh[i], sh[j]] = [sh[j], sh[i]]; } pr = []; for(let i = 0; i+1 < N; i += 2) pr.push([sh[i], sh[i+1]]); }
      for(const [a,b] of pr){ if(sc[a] > sc[b]) wins[a]++; else wins[b]++; }
      if(L.median){ const so = Array.from(sc).sort((x,y)=>x-y), med = (so[(N-1)>>1] + so[N>>1])/2; for(let i = 0; i < N; i++) if(sc[i] > med) wins[i]++; }
    }
    const order = ids.slice().sort((a,b)=>wins[b]-wins[a] || pf[b]-pf[a]);
    order.forEach((i,k)=>{ seedOf[i] = k; if(k < P) po[i]++; else if(k === P) bub[i]++; });
    let alive = order.slice(0, P);
    while(alive.length > 1){
      let p2 = 1; while(p2 < alive.length) p2 *= 2;
      const byes = p2 - alive.length, next = alive.slice(0, byes), rest = alive.slice(byes);
      for(let k = 0; k < rest.length/2; k++){ const a = rest[k], b = rest[rest.length-1-k];
        next.push(mean[a] + sd[a]*gauss(r) >= mean[b] + sd[b]*gauss(r) ? a : b); }
      alive = next.sort((a,b)=>seedOf[a]-seedOf[b]);
    }
    if(alive.length) title[alive[0]]++;
  }
  return T.map((t,i)=>({po:po[i]/n, bub:bub[i]/n, title:title[i]/n}));
}

function classify(t, N){
  const o = t.odds, b = t.bp, base = 1/N, futTop = b.futRank <= N/2, aging = b.y2 < b.dyn*0.85;
  const P = o.po, T = o.title;
  if(P >= 0.8 && T >= 1.5*base && futTop) return "stay";
  if(P >= 0.6) return T >= 1.3*base && (!futTop || aging) ? "allin" : "contend";
  if(P <= 0.2) return futTop ? "rebuild" : "teardown";
  if(t.sens != null && ((t.sens >= 0.55 && t.sens - P >= 0.12) || (aging && !futTop && t.sens >= 0.5))) return "push";
  return futTop ? "retool" : "sell";
}

function diagnoseLeague(L){
  const N = L.N, P = L.playoffTeams, T = L.teams;
  const odds = simulate(L, null, 1000, 7);
  const rankBy = f => { const o = T.map((t,i)=>i).sort((a,b)=>f(T[b])-f(T[a])); return i=>o.indexOf(i)+1; };
  const stand = (()=>{ const o = T.map((t,i)=>i).sort((a,b)=>T[b].wins-T[a].wins || T[b].pf-T[a].pf); return i=>o.indexOf(i)+1; })();
  const meanR = rankBy(t=>t.mean), pfR = rankBy(t=>t.pf);
  const opp = T.map(()=>[]);
  for(const pr of L.weeks) if(pr) for(const [a,b] of pr){ opp[a].push(T[b].mean); opp[b].push(T[a].mean); }
  T.forEach((t,i)=>{ t.sos = opp[i].length ? opp[i].reduce((s,v)=>s+v,0)/opp[i].length : null; });
  const sosR = rankBy(t=>t.sos == null ? -1 : t.sos);
  T.forEach((t,i)=>{ t.i = i; t.odds = odds[i]; t.stand = stand(i); t.meanRank = meanR(i); t.pfRank = pfR(i); t.sosRank = t.sos == null ? null : sosR(i); });

  const bubble = T.filter(t=>t.odds.po > 0.2 && t.odds.po < 0.6);
  if(bubble.length && L.weeks.length){
    const base = simulate(L, null, 400, 9);
    for(const t of bubble){ const up = simulate(L, {[t.i]:6}, 400, 9)[t.i].po; t.sens = Math.min(1, Math.max(0, t.odds.po + up - base[t.i].po)); }
  }
  T.forEach(t=>t.dir = classify(t, N));
  L.me = T.find(t=>t.rid===L.b.me.rid);
}

/* ---------- trade finder: offers that move your team in its direction ---------- */
const pmOf = arr => Math.pow(arr.reduce((s,a)=>s + Math.pow(Math.max(a.v,0), 1.3), 0), 1/1.3);
const sumV = arr => arr.reduce((s,a)=>s+a.v, 0);
function assetsOf(L, t){

  const picks = t.bp.picks.filter(p=>p.round<=3 && p.val>0).map(p=>{ const n = pickName(p, L.fc);

function bestPackage(pool, lo, hi, cost){

  const check = pkg => { const m = pmOf(pkg); if(m < lo || m > hi) return; const c = cost(pkg, m); if(c < bc){ bc = c; best = pkg; } };

function evalTrade(L, me, them, give, get){

  const after = simulate(L, {[me.i]:dMe, [them.i]:dTh}, 800, 11);

  const futRank = (v, other) => 1 + rest.filter(x=>x > v).length + (other > v ? 1 : 0);

  const clamp = x => Math.max(0, Math.min(1, x)), shift = (t, k) => [t.odds[k], clamp(t.odds[k] + after[t.i][k] - base[t.i][k])];
  const [mp0, mp1] = shift(me, "po"), [mt0, mt1] = shift(me, "title"), [tp0, tp1] = shift(them, "po");
  return {give, get, them, dMe, dTh, giveV:pmOf(give), getV:pmOf(get),
    me:{po0:mp0, po1:mp1, t0:mt0, t1:mt1, y0:me.bp.young, y1:myY, f0:me.bp.futRank, f1:futRank(myY, thY)},

}
function acceptance(ev, mode, act){
  const t = ev.them, buyer = BUYERS.has(t.dir), ratio = ev.giveV / Math.max(ev.getV, 1);   // what they get / what they give

  if(mode==="sell" && buyer) z += 0.5 + 4*(ev.th.po1 - ev.th.po0);
  if(mode==="buy" && !buyer) z += 0.5 + 2*Math.max(0, (ev.th.y1 - ev.th.y0)/Math.max(ev.th.y0, 1));
  if(mode==="buy" && buyer) z -= 0.6;
  const a = act[t.rid] || {trades:0, moves:0, last:0};
  z += Math.min(0.6, 0.25*a.trades) + (a.last && Date.now()-a.last < 14*864e5 ? 0.25 : 0) - (a.moves ? 0 : 1.2);

function buildDetail(L){
  L.base800 ||= simulate(L, null, 800, 11);

  const mine = assetsOf(L, me), CORE = ["QB","RB","WR","TE"];
  const myTop2 = new Set(mine.players.slice().sort((a,b)=>b.v-a.v).slice(0,2).map(a=>a.k));
  // BUY: players who raise your weekly lineup, paid for with bench pieces and picks
  const payPool = mine.players.filter(a=>!a.starter && !myTop2.has(a.k) && a.v >= 150).concat(mine.picks).sort((a,b)=>b.v-a.v);
  let cands = [];
  for(const t of others){ const A = assetsOf(L, t), top = A.players.slice().sort((a,b)=>b.v-a.v)[0];
    const per = [];
    for(const p of A.players){ if(!CORE.includes(p.pos) || p.pts < 4) continue;
      const gain = lineupPts(lg, me.ids.concat(p.id), L.cache).pts - me.proj; if(gain < 1.5) continue;
      per.push({t, p, gain, w: gain - (BUYERS.has(t.dir) ? 3 : 0) - (p===top ? 2 : 0)}); }
    cands.push(...per.sort((a,b)=>b.w-a.w).slice(0,2)); }
  const buy = [];
  for(const c of cands.sort((a,b)=>b.w-a.w).slice(0,14)){
    const T = c.p.v, seller = !BUYERS.has(c.t.dir);
    const pkg = bestPackage(payPool, T*0.98, T*1.3, (k,m)=>Math.abs(m/(T*1.08)-1) + 0.05*(k.length-1) - (seller ? 0.03*k.filter(a=>a.young).length : 0));
    if(!pkg) continue;
    const ev = evalTrade(L, me, c.t, pkg, [c.p]); ev.mode = "buy"; ev.acc = acceptance(ev, "buy", act);
    ev.gainMe = (ev.me.po1-ev.me.po0) + 2*(ev.me.t1-ev.me.t0);
    if(ev.gainMe > 0.005) buy.push(ev);
  }
  // SELL: aging starters to teams that need them, for young players and picks
  let pieces = mine.players.filter(a=>a.r >= 700 && (a.old || (a.age && a.age >= 26))).sort((a,b)=>b.r-a.r).slice(0,4);
  if(!pieces.length) pieces = mine.players.filter(a=>a.starter && !a.young && a.r >= 700).sort((a,b)=>b.r-a.r).slice(0,2);
  const sell = [];

    const opts = [];

      const gain = lineupPts(lg, t.ids.concat(piece.id), L.cache).pts - t.proj; if(gain < 1) continue;
      opts.push({t, gain, w: gain*(BUYERS.has(t.dir) ? 1.5 : 1)}); }

      const A = assetsOf(L, o.t), top2 = new Set(A.players.slice().sort((a,b)=>b.v-a.v).slice(0,2).map(a=>a.k));
      const ask = A.players.filter(a=>!a.starter && a.young && a.v >= 150 && !top2.has(a.k)).concat(A.picks).sort((a,b)=>b.v-a.v);
      const V = piece.v;
      const pkg = bestPackage(ask, V*0.85, V*1.12, (k,m)=>Math.abs(m/V-1) + 0.04*(k.length-1));
      if(!pkg) continue;
      const ev = evalTrade(L, me, o.t, [piece], pkg); ev.mode = "sell"; ev.acc = acceptance(ev, "sell", act);
      ev.gainMe = (ev.me.y1-ev.me.y0)/Math.max(ev.me.y0, 1);

    for(const ev of list.sort((a,b)=>b.gainMe*(0.35+b.acc) - a.gainMe*(0.35+a.acc))){
      const key = ev.give.concat(ev.get).map(a=>a.k).join("|"), main = (ev.get[0]||{}).k + ">" + (ev.give[0]||{}).k;
      const core = (ev.mode==="sell" ? ev.give[0] : ev.get[0]).k;
      if((per[ev.them.rid]||0) >= 2 || used.has(main) || (per["a"+core]||0) >= 2) continue;
      per[ev.them.rid] = (per[ev.them.rid]||0) + 1; per["a"+core] = (per["a"+core]||0) + 1; used.add(main); used.add(key); out.push(ev); if(out.length >= 6) break; }
    return out; };
  return {buy: pick(buy), sell: pick(sell), primary: DIR[me.dir].mode};
}

/* ---------- direction: words ---------- */
function headline(L, t){
  const o = t.odds, b = t.bp, N = L.N, weak = ["QB","RB","WR","TE"].slice().sort((x,y)=>b.posRank[y]-b.posRank[x])[0];
  switch(t.dir){
    case "stay": return `${pct(o.po)} playoff odds, ${pct(o.title)} to win it, and your future value ranks ${ord(b.futRank)}. You're built for now and later. Only add depth.`;
    case "allin": return `${pct(o.title)} title odds, ${(o.title*N).toFixed(1)}× the league average, with a roster that ${b.y2 < b.dyn*0.85 ? "is aging" : "ranks " + ord(b.futRank) + " in future value"}. This is your window. Trade picks and prospects for points.`;
    case "contend": return `${pct(o.po)} playoff odds. Your weakest spot is ${weak} (${b.grades[weak]}). Fixing it is how you raise your ${pct(o.title)} title odds.`;
    case "push": return `You're a coin flip for the playoffs (${pct(o.po)}) and one starter-level upgrade takes you to ${pct(t.sens)}. Buy now while it still counts.`;
    case "retool": return `${pct(o.po)} playoff odds and ${pct(o.title)} to win it, but your young core ranks ${ord(b.futRank)} of ${N}. Sell aging starters while contenders still pay for them.`;
    case "sell": return `${pct(o.po)} playoff odds, ${pct(o.title)} to win it, and future value ${ord(b.futRank)} of ${N}. Standing still lands you just outside the money. Cash out vets for youth and picks.`;
    case "rebuild": return `${pct(o.po)} playoff odds, but future value ranks ${ord(b.futRank)} of ${N}. Keep selling vets for youth and picks.`;
    default: return `${pct(o.po)} playoff odds and future value ${ord(b.futRank)} of ${N}. Sell every veteran with value and restart around youth and picks.`;
  }
}
function confidence(t){
  const P = t.odds.po, m = Math.min(...[0.2, 0.6, 0.8].map(x=>Math.abs(P-x)));
  return m < 0.05 ? "Close call" : m < 0.12 ? "Lean" : "Clear call";
}
function whyLines(L, t){
  const N = L.N, o = t.odds, P = L.playoffTeams, b = t.bp, out = [];
  const firstOut = L.teams.find(z=>z.stand===P+1), lastIn = L.teams.find(z=>z.stand===P);
  const gb = t.stand <= P ? (firstOut ? (t.wins-firstOut.wins ? `${games(t.wins-firstOut.wins)} ahead of the first team out` : "tied in wins with the first team out") : "")
                          : (lastIn ? (lastIn.wins-t.wins ? `${games(lastIn.wins-t.wins)} behind the last playoff spot` : "tied in wins with the last playoff spot, behind on points") : "");
  out.push(["Standings", `${b.rec}, ${ord(t.stand)} of ${N}${gb?" · "+gb:""} · ${ord(t.pfRank)} in points scored`]);
  out.push(["Strength", `About ${fmt(t.mean)} pts a week from here, ${ord(t.meanRank)} best. Blends your real scoring with your best lineup's projections.`]);
  if(t.sos != null) out.push(["Schedule", `${L.weeks.length} game${L.weeks.length===1?"":"s"} left, ${t.sosRank===1?"the":ord(t.sosRank)} hardest schedule (opponents average ${fmt(t.sos)})`]);
  else if(!L.weeks.length) out.push(["Schedule", "Regular season is over"]);
  out.push(["Odds", `${pct(o.po)} to make the top ${P} · ${pct(o.bub)} to finish ${ord(P+1)}, first team out · ${pct(o.title)} to win the title (average ${pct(1/N)})`]);
  if(t.sens != null) out.push(["Leverage", `One starter-level upgrade (+6 pts a week) moves your playoff odds from ${pct(o.po)} to ${pct(t.sens)}`]);
  const chg = (b.y2 - b.dyn)/Math.max(b.dyn, 1);
  out.push(["Window", `Future value ${ord(b.futRank)} of ${N} · value-weighted age ${b.age.toFixed(1)} · held as is, the roster ${chg<0?"loses":"gains"} about ${Math.abs(Math.round(chg*100))}% of its value over 2 seasons`]);
  const firsts = b.picks.filter(p=>p.round===1).length;
  out.push(["Assets", `${firsts} first-round pick${firsts===1?"":"s"} over the next 3 drafts · ${["QB","RB","WR","TE"].map(p=>p+" "+b.grades[p]).join(", ")}`]);
  return out;
}
function pitchText(ev, mode){
  const t = ev.them, b = t.bp, buyer = BUYERS.has(t.dir);
  const list = arr => arr.map(a=>a.name).join(" + ");
  const s = [`Hey ${b.name}, ${buyer ? `you're ${b.rec} and in the race.` : "looks like you're building toward next year."} ${mode==="buy" ? "I'm making a push this season." : "I'm retooling for next year."}`];
  s.push(`Would you do ${list(ev.give)} for ${list(ev.get)}?`);
  if(ev.th.po1 - ev.th.po0 >= 0.03) s.push(`By my projections it adds about ${fmt(ev.dTh)} points a week to your lineup and takes your playoff odds from ${pct(ev.th.po0)} to ${pct(ev.th.po1)}.`);
  const yg = ev.give.filter(a=>a.young);
  if(!buyer && yg.length) s.push(`You'd get ${yg.map(a=>a.pos==="PICK" ? a.name.replace(" (via trade)","") : `${a.name}${a.age?` (${Math.floor(a.age)})`:""}`).join(" and ")}, which fits where your roster is headed.`);
  if(ev.giveV >= ev.getV*0.98) s.push(`On FantasyCalc you come out ahead: ${Math.round(sumV(ev.give)).toLocaleString()} in value for ${Math.round(sumV(ev.get)).toLocaleString()}.`);

}
function marketLines(ev, mode){
  const out = [];
  for(const a of ev.get.concat(ev.give)){ if(a.pos==="PICK" || !a.v) continue;
    const tr = a.trend/a.v, buying = ev.get.includes(a);
    if(buying && tr <= -0.05) out.push(`${a.name}'s value is down ${Math.round(-tr*100)}% in 30 days: buy-low window.`);
    if(!buying && tr >= 0.05) out.push(`${a.name}'s value is up ${Math.round(tr*100)}% in 30 days: sell-high window.`);
    if(!buying && tr <= -0.08) out.push(`${a.name}'s value is down ${Math.round(-tr*100)}% in 30 days. Sell before it drops further.`);
    const m = marketFor(a.id);
    if(m.length) out.push(`${a.name}: traded ${m.length}× in your leagues this season. Latest, ${new Date(m[0].ts).toLocaleDateString([], {month:"short", day:"numeric"})}: cost ${m[0].paid.join(", ") || "nothing listed"}.`);
  }
  return out.slice(0, 3);
}

function offerHTML(L, ev, mode){

/* ---------- today: what matters right now ---------- */
function todayCard(){
  const now = new Date(new Date().toLocaleString("en-US", {timeZone:"America/New_York"})), d = now.getDay(), hr = now.getHours();
  const crit = S.results.filter(r=>r.sev==="crit").length;
  if(d===2 || d===3 && hr < 12 || d===1 && hr >= 23) return {title:"Waiver night", text:"Most of your leagues process claims overnight. Set bids before you go to bed.", tab:"waivers", cta:"Open waivers"};
  if(d===4) return {title:"Thursday kickoff", text:`${crit} league${crit===1?"":"s"} still have a starter who can't play. Fix Thursday players first; they lock tonight.`, tab:"queue", cta:"Fix lineups"};
  if(d===5 || d===6) return {title:"Trade window", text:"Injury news is mostly in. Good time to make offers before Sunday.", tab:"direction", cta:"See directions"};
  if(d===0) return {title:"Game day", text:`${crit} league${crit===1?"":"s"} need a fix. Check Questionable players about 90 minutes before kickoff.`, tab:"queue", cta:"Fix lineups"};
  return {title:"Monday", text:"Last game tonight. Waivers open after it ends.", tab:"waivers", cta:"Preview waivers"};
}

function statusTag(f){

  return `<span class="tag ${cls}">${lab}</span>`;
}

function cardHTML(r, full){

  else if(r.sev==="ok") h += `<ul class="issues"><li class="issue"><span class="pill p-ok">Set</span><span class="txt">Lineup is optimal and healthy</span></li></ul>`;

function lineupHTML(r){
  const info = p => p && p!=="0" ? r._c[p] || pinfo(p, r.league) : null;

  }).join("") + `</div>`;

function exposure(){
  const map = {};
  for(const r of S.results){ if(!r.roster || r.sev==="off") continue;
    const reserve = new Set(r.roster.reserve||[]), taxi = new Set(r.roster.taxi||[]), st = new Set(r.current||[]), opt = new Set(r.opt||[]);
    for(const p of r.roster.players||[]){
      const f = r._c[p] || (r._c[p] = pinfo(p, r.league));
      const e = map[p] ||= {f, leagues:[], start:0, bench:0, wrong:0};
      const role = st.has(p) ? "Starting" : reserve.has(p) ? "IR" : taxi.has(p) ? "Taxi" : "Bench";
      if(role==="Starting") e.start++; if(role==="Bench") e.bench++;
      const shouldStart = opt.has(p);
      if((role==="Starting") !== shouldStart && role!=="IR" && role!=="Taxi" && !f.locked) e.wrong++;
      e.leagues.push({r, role, shouldStart, pts: f.eff});
    }
  }
  return Object.values(map);
}
function renderPlayers(){
  let list = exposure();
  const q = S.query.trim().toLowerCase();
  if(q) list = list.filter(e=>e.f.full.toLowerCase().includes(q) || (e.f.team||"").toLowerCase()===q);
  if(S.playerFilter==="hurt") list = list.filter(e=>e.f.status || e.f.reason);
  if(S.playerFilter==="mismatch") list = list.filter(e=>e.wrong>0);
  list.sort((a,b)=>b.leagues.length-a.leagues.length || b.f.raw-a.f.raw);
  const chips = [["all","Most rostered"],["hurt","Injured or bye"],["mismatch","Start/sit mismatch"]].map(([k,l])=>`<button class="chip" data-pf="${k}" aria-pressed="${S.playerFilter===k}">${l}</button>`).join("");
  let h = `<input class="search" id="q" type="search" placeholder="Find a player or team (e.g. Puka, KC)" value="${esc(S.query)}" autocomplete="off"><div class="chips">${chips}</div>`;
  if(!list.length) return h + `<div class="empty">No players match.</div>`;
  h += `<div class="plist">` + list.slice(0, q ? 60 : 40).map(e=>{
    const f = e.f; const g = f.game;

    return `<div class="prow"><div class="ptop"><span class="nm">${esc(f.full)}${statusTag(f)}</span><span class="pos">${f.pos} · ${f.team||"FA"}</span><span class="num">×${e.leagues.length}</span></div>

  }).join("") + `</div>`;
  return h;
}
function leagueMap(b){
  const N = b.N, W = 320, H = 190, pad = 22;
  const X = r => pad + (N - r) / Math.max(1, N - 1) * (W - 2*pad), Y = r => pad + (r - 1) / Math.max(1, N - 1) * (H - 2*pad);

    return `<circle cx="${X(t.futRank).toFixed(1)}" cy="${Y(t.nowRank).toFixed(1)}" r="${me?6:4}" fill="${me?"var(--accent)":"var(--muted)"}" opacity="${me?1:.55}"><title>${esc(t.name)}: ${ARCH[t.arch].label}</title></circle>` +

  return `<div class="map"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="League map: win-now strength vs future value">
    <line x1="${W/2}" x2="${W/2}" y1="${pad-8}" y2="${H-pad+8}" stroke="var(--line)"/><line x1="${pad-8}" x2="${W-pad+8}" y1="${H/2}" y2="${H/2}" stroke="var(--line)"/>
    <text x="${pad-6}" y="12" font-size="10" fill="var(--muted)">Strong now, old</text><text x="${W-pad+6}" y="12" font-size="10" text-anchor="end" fill="var(--muted)">Strong now and later</text>
    <text x="${pad-6}" y="${H-3}" font-size="10" fill="var(--muted)">Weak now and later</text><text x="${W-pad+6}" y="${H-3}" font-size="10" text-anchor="end" fill="var(--muted)">Young, building</text>
    ${dots}</svg></div>`;
}

function renderBlueprints(){
