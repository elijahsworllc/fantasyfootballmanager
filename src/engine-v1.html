function renderSetup(){
  return `<section class="setup"><h2>Every lineup, one screen</h2>
    <p>Enter your Sleeper username. The app reads your leagues straight from Sleeper's public API, scores every player with each league's own settings, and lists what needs fixing before kickoff. Nothing to log in to, nothing stored on a server.</p>
    <form class="field" id="setupform"><input id="uname" placeholder="Sleeper username" value="${esc(S.username)}" autocapitalize="off" autocorrect="off" spellcheck="false" required><button class="primary" type="submit">Scan leagues</button></form>
    ${S.error?`<div class="err">${esc(S.error)}</div>`:""}</section>`;
}
function renderSettings(){
  return `<details class="settings"><summary>Settings</summary>
    <div class="srow"><label for="thr">Flag upgrades worth at least</label><select id="thr">${[0.5,1,1.5,2,3,5].map(v=>`<option value="${v}" ${+S.threshold===v?"selected":""}>${v} pts</option>`).join("")}</select></div>
    <div class="srow"><label for="hd">Hide leagues marked done</label><input type="checkbox" id="hd" ${S.hideDone?"checked":""}></div>
    <div class="srow"><span>Signed in as <b>${esc(S.displayName||S.username)}</b></span><button class="ghost" id="switch">Switch user</button></div>
    <p class="note">Projections come from Sleeper (Rotowire) and are rescored with each league's settings. Questionable players count at 85% and Doubtful at 20% when comparing options. Sleeper doesn't share whether you've set an auto-sub, so Questionable starters stay flagged until you swap them.</p></details>`;
}
/* ---------- navigation + hero ---------- */
const NAV_OF = {queue:"lineups", leagues:"lineups", waivers:"waivers", direction:"direction", blueprints:"teams", players:"teams"};
const NAV_HOME = {lineups:"queue", waivers:"waivers", direction:"direction", teams:"blueprints"};
const NAV_TITLE = {lineups:"Lineups", waivers:"Waivers", direction:"Direction", teams:"Teams"};
const lastSub = {lineups:"queue", teams:"blueprints"};
const reduceMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function goTab(tab, opts={}){
  const run = () => { S.tab = tab; const n = NAV_OF[tab]; if(n in lastSub) lastSub[n] = tab; if(opts.clearFilter) S.filter = null; render(); if(!opts.keepScroll) window.scrollTo(0,0); };
  if(document.startViewTransition && !reduceMotion() && !opts.instant) document.startViewTransition(run); else run();
}
function placeDockIndicator(){
  const b = document.querySelector('.dock [aria-current="page"]'), ind = $("dockInd"); if(!b || !ind) return;
  ind.style.setProperty("--x", (b.offsetLeft + 6) + "px"); ind.style.setProperty("--w", (b.offsetWidth - 12) + "px");
}
let heroDrawn = false;
function heroHTML(){
  const c = counts(), total = c.crit + c.warn + c.up + c.ok;
  if(!total) return "";
  const R = 54, C = 2*Math.PI*R, gap = 3; let off = 0;
  const segs = ["crit","warn","up","ok"].filter(k=>c[k]).map(k=>{
    const len = c[k]/total*C, draw = Math.max(0.5, len - (total > c[k] ? gap : 0));
    const s = `<circle cx="64" cy="64" r="${R}" fill="none" stroke="var(--${k})" stroke-width="13" stroke-dasharray="${draw} ${C}" stroke-dashoffset="${-off}" stroke-linecap="butt"/>`;
    off += len; return s; }).join("");
  const animate = !heroDrawn && !reduceMotion(); heroDrawn = true;
  const mask = `<mask id="hm"><circle cx="64" cy="64" r="${R}" fill="none" stroke="#fff" stroke-width="16" stroke-dasharray="${C}" style="--c:${C}" class="${animate?"sweep":""}"/></mask>`;
  const center = c.crit ? `<b>${c.crit}</b><span>of ${total} lineups need a fix</span>` : `<b>${total}</b><span>lineups, none blocked</span>`;
  const items = [["crit","Must fix"],["warn","To check"],["up","Upgrades"],["ok","Set"]];
  return `<section class="hero"><div class="ring" role="img" aria-label="${c.crit} must fix, ${c.warn} to check, ${c.up} upgrades, ${c.ok} set"><svg viewBox="0 0 128 128"><defs>${mask}</defs>
    <circle cx="64" cy="64" r="${R}" fill="none" stroke="var(--plate-2)" stroke-width="13"/><g mask="url(#hm)">${segs}</g></svg><div class="ctr">${center}</div></div>
    <div class="legend">${items.map(([k,l])=>`<button class="k-${k}" data-f="${k}" aria-pressed="${S.filter===k}"><i></i><b>${c[k]}</b><span>${l}</span></button>`).join("")}</div></section>`;
}
function segHTML(opts){
  const i = Math.max(0, opts.findIndex(o=>o[0]===S.tab)), from = S.segFrom != null ? S.segFrom : i;
  S.segTo = i;
  return `<div class="seg" role="tablist" style="--n:${opts.length};--i:${from}">${opts.map(([t,l])=>`<button role="tab" data-seg="${t}" aria-selected="${S.tab===t}">${l}</button>`).join("")}<i aria-hidden="true"></i></div>`;
}
function slideSegments(){
  const el = document.querySelector(".seg"); S.segFrom = null;
  if(el && S.segTo != null) requestAnimationFrame(()=>el.style.setProperty("--i", S.segTo));
}
function render(){
  const ready = S.userId && (S.results.length || S.loading);
  $("dock").hidden = !ready; $("wkctl").hidden = !ready; $("refresh").hidden = !ready;
  $("refresh").classList.toggle("spin", !!(S.loading || S.refreshing));
  if(S.week) $("wklabel").textContent = "Wk " + S.week;
  const nav = NAV_OF[S.tab] || "lineups";
  $("screenTitle").textContent = ready ? NAV_TITLE[nav] : "Command Center";
  $("sub").textContent = ready && S.displayName ? `${S.displayName}, ${S.season||""} season` : "Every lineup, one screen";
  document.querySelectorAll("[data-nav]").forEach(b=>{ if(b.dataset.nav===nav) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  if(ready) requestAnimationFrame(placeDockIndicator);
  const main = $("main");
  if(!ready){ main.innerHTML = S.loading ? `<div class="status" id="statusline"></div>` : renderSetup(); renderStatus(); bind(); return; }
  const focusId = document.activeElement && ["q","mq"].includes(document.activeElement.id) ? document.activeElement.id : null; const focusQ = !!focusId;
  const pos = focusQ ? document.activeElement.selectionStart : null;
  let body = nav==="lineups" && !S.loading ? heroHTML() : "";
  body += `<div class="status" id="statusline"></div>`;
  if(S.error) body += `<div class="err">${esc(S.error)}</div>`;
  if(!S.loading){
    if(nav==="lineups") body += segHTML([["queue","Needs action"],["leagues","All leagues"]]);
    if(nav==="teams") body += segHTML([["blueprints","Team reviews"],["players","Player exposure"]]);
    if(S.tab==="queue" && !S.filter){ const tc = todayCard(); body += `<section class="today"><div><b>${tc.title}</b><span>${esc(tc.text)}</span></div>${tc.tab!=="queue"?`<button class="ghost" data-goto="${tc.tab}">${tc.cta}</button>`:""}</section>`; }
    if(S.tab==="waivers") body += renderWaivers();
    if(S.tab==="direction") body += renderDirection();
    if(S.tab==="queue") body += (S.filter?`<div class="chips"><button class="chip" aria-pressed="true" id="clearf">Showing: ${{crit:"Must fix",warn:"To check",up:"Upgrades",ok:"Set"}[S.filter]} ✕</button></div>`:"") + renderQueue();
    if(S.tab==="leagues") body += renderLeagues();
    if(S.tab==="players") body += renderPlayers();
    if(S.tab==="blueprints") body += renderBlueprints();
    const busy = (S.tab==="waivers" && S.wvLoading) || (S.tab==="direction" && S.dirLoading) || ((S.tab==="blueprints") && S.bpLoading);
    if(busy) body += `<div class="skel" aria-hidden="true"><i></i><i></i><i></i></div>`;
    else body += renderSettings();
    body = body.replace(`<h3>${NAV_TITLE[nav]}</h3>`, "");
  }
  main.innerHTML = body; renderStatus(); bind(); slideSegments();
  if(focusQ && $(focusId)){ const q = $(focusId); q.focus(); try{ q.setSelectionRange(pos,pos); }catch(e){} }
}
function bind(){
  const f = $("setupform");
  if(f) f.onsubmit = e=>{ e.preventDefault(); S.username = $("uname").value.trim(); if(!S.username) return; store.set("username", S.username); S.userId = null; loadAll(null); };
  document.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>toggleDone(b.dataset.done));
  document.querySelectorAll("[data-expand]").forEach(b=>b.onclick=()=>{ const id=b.dataset.expand; S.expanded.has(id)?S.expanded.delete(id):S.expanded.add(id); render(); });
  document.querySelectorAll("[data-arch]").forEach(b=>b.onclick=()=>{ S.bpArch = S.bpArch===b.dataset.arch ? null : b.dataset.arch; render(); });
  document.querySelectorAll("[data-pf]").forEach(b=>b.onclick=()=>{ S.playerFilter=b.dataset.pf; render(); });
  const q = $("q"); if(q) q.oninput = ()=>{ S.query = q.value; render(); };
  const mq = $("mq"); if(mq) mq.oninput = ()=>{ S.mq = mq.value; render(); };
  document.querySelectorAll("[data-wf]").forEach(b=>b.onclick=()=>{ S.wvFilter=b.dataset.wf; render(); });
  document.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>goTab(b.dataset.goto));
  document.querySelectorAll(".legend [data-f]").forEach(b=>b.onclick=()=>{ S.filter = S.filter===b.dataset.f ? null : b.dataset.f; S.tab = "queue"; render(); });
  document.querySelectorAll("[data-seg]").forEach(b=>b.onclick=()=>{ const cur = document.querySelector(".seg"); S.segFrom = cur ? +getComputedStyle(cur).getPropertyValue("--i") : null; goTab(b.dataset.seg, {keepScroll:true, instant:true}); });
  document.querySelectorAll("[data-cbt]").forEach(b=>b.onclick=()=>{ try{ cbPrefillTrade(JSON.parse(b.dataset.cbt)); }catch(e){} });
  document.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>{ S.dirLid = b.dataset.dir; render(); window.scrollTo(0,0); });
  document.querySelectorAll("[data-dirback]").forEach(b=>b.onclick=()=>{ S.dirLid = null; render(); window.scrollTo(0,0); });
  document.querySelectorAll("[data-dirf]").forEach(b=>b.onclick=()=>{ S.dirFilter = b.dataset.dirf || null; render(); });
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{ const txt = b.dataset.copy;
    try{ await navigator.clipboard.writeText(txt); }catch(e){ const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); }catch(_){} ta.remove(); }
    b.textContent = "Copied ✓"; setTimeout(()=>{ b.textContent = "Copy message"; }, 1800); });
  const cf = $("clearf"); if(cf) cf.onclick = ()=>{ S.filter=null; render(); };
  const thr = $("thr"); if(thr) thr.onchange = ()=>{ S.threshold=+thr.value; store.set("threshold",S.threshold); reanalyze(); };
  const hd = $("hd"); if(hd) hd.onchange = ()=>{ S.hideDone=hd.checked; store.set("hideDone",S.hideDone); render(); };
  const sw = $("switch"); if(sw) sw.onclick = ()=>{ S.userId=null; S.results=[]; S.displayName=""; S.error=null; render(); };
}
function reanalyze(){ runAnalysis(); render(); }

document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{ const n = b.dataset.nav; const t = lastSub[n] || NAV_HOME[n];
  if(NAV_OF[S.tab]===n){ window.scrollTo({top:0, behavior: reduceMotion() ? "auto" : "smooth"}); if(n==="direction" && S.dirLid){ S.dirLid = null; render(); } return; }
  goTab(t); });
window.addEventListener("scroll", ()=>$("topbar").classList.toggle("scrolled", window.scrollY > 12), {passive:true});
window.addEventListener("resize", placeDockIndicator);
$("refresh").onclick = ()=>loadAll(S.week, {quiet: S.results.length > 0});
$("orbBtn").onclick = openCB;
$("cbClose").onclick = closeCB;
$("cb").addEventListener("click", e=>{ if(e.target.id==="cb") closeCB(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("cb").hidden) closeCB(); });
$("wkprev").onclick = ()=>{ if(S.week>1) loadAll(S.week-1); };
$("wknext").onclick = ()=>{ if(S.week<18) loadAll(S.week+1); };

render();
startup();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
