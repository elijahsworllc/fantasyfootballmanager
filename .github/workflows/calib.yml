name: Value-model calibration inputs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/calib-inputs.mjs", ".github/workflows/calib.yml"]
permissions:
  contents: read
concurrency:
  group: calib
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: mkdir -p data-branch
      - name: Collect calibration inputs
        env:
          SLEEPER_USERNAME: jahswor
          OUT_DIR: data-branch
        run: node backend/calib-inputs.mjs
      - name: Save to the private FFU store
        run: node backend/store.mjs push data-branch
