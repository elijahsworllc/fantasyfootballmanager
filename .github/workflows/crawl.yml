name: Grow the FFU trade database
on:
  schedule:
    - cron: "40 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/crawl.mjs", "backend/db.mjs", "backend/clean.mjs", "backend/store.mjs", ".github/workflows/crawl.yml"]
permissions:
  contents: read
concurrency:
  group: data-branch          # shared with the nightly market job: queued, never cancelled
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull data from the private FFU store
        run: node backend/store.mjs pull data-branch --only trades-db.json.gz,crawl-state.json.gz,market.json,excluded.json
      - name: Crawl league-mates' leagues, trades and roster owners
        env:
          SEED_USERS: jahswor
          OUT_DIR: data-branch
        run: node backend/crawl.mjs
      - name: Save data to the private FFU store
        if: ${{ !cancelled() }}   # keep what earlier steps produced (market prices, values) even if a later step failed
        run: node backend/store.mjs push data-branch
