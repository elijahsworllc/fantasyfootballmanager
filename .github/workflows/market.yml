name: Nightly market data
on:
  schedule:
    - cron: "20 9 * * *"   # about 5am New York time, after overnight waivers
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/market.mjs", "backend/sleeper.mjs", ".github/workflows/market.yml"]
permissions:
  contents: write
concurrency:
  group: market
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect transactions and values
        env:
          SLEEPER_USERNAME: jahswor
          OUT_DIR: data-branch
        run: node backend/market.mjs
      - name: Publish data
        run: |
          cd data-branch
          git config user.name "command-center-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Market data $(date -u +%F)" && git push)
