name: Nightly market data
on:
  schedule:
    - cron: "20 9 * * *"   # about 5am New York time, after overnight waivers
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/market.mjs", "backend/sleeper.mjs", "backend/inhouse.mjs", "backend/dp.mjs", "backend/managers.mjs", "backend/ffu-values.mjs", "backend/ffu-index.mjs", "backend/db.mjs", "backend/clean.mjs", "backend/store.mjs", ".github/workflows/market.yml"]
permissions:
  contents: read
concurrency:
  group: data-branch          # shared with the crawl: one data job at a time, queued, never cancelled
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull data from the private FFU store
        run: node backend/store.mjs pull data-branch --skip crawl-state.json.gz,alert-state.json
      - name: Collect transactions and values
        env:
          SLEEPER_USERNAME: jahswor
          OUT_DIR: data-branch
        run: node backend/market.mjs
      - name: Expert values (DynastyProcess second opinion)
        env:
          OUT_DIR: data-branch
        run: node backend/dp.mjs
      - name: Fit in-house values
        run: node backend/inhouse.mjs data-branch
      - name: FFU Index (values from trades only) and its scorecard
        continue-on-error: true
        run: node backend/ffu-index.mjs data-branch
      - name: Daily FFU values
        run: node backend/ffu-values.mjs data-branch
      - name: Manager profiles (trade-day values)
        run: node backend/managers.mjs data-branch
      - name: Save data to the private FFU store
        if: ${{ !cancelled() }}   # keep what earlier steps produced (market prices, values) even if a later step failed
        run: node backend/store.mjs push data-branch
