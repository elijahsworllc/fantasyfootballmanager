name: Nightly market data
on:
  schedule:
    - cron: "20 9 * * *"   # about 5am New York time, after overnight waivers
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/market.mjs", "backend/sleeper.mjs", "backend/crawl.mjs", "backend/inhouse.mjs", "backend/dp.mjs", "backend/managers.mjs", ".github/workflows/market.yml"]
permissions:
  contents: write
concurrency:
  group: market
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect transactions and values
        env:
          SLEEPER_USERNAME: jahswor
          OUT_DIR: data-branch
        run: node backend/market.mjs
      - name: Expert values (DynastyProcess second opinion)
        env:
          OUT_DIR: data-branch
        run: node backend/dp.mjs
      - name: Grow the trade database (league-mates' leagues)
        env:
          SEED_USERS: jahswor
          OUT_DIR: data-branch
        run: node backend/crawl.mjs
      - name: Fit in-house values
        run: node backend/inhouse.mjs data-branch
      - name: Manager profiles (trade-day values)
        run: node backend/managers.mjs data-branch
      - name: Publish data
        run: |
          cd data-branch
          git config user.name "command-center-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Market data $(date -u +%F)" && git push)
