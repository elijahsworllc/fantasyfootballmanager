name: Nightly market data
on:
  schedule:
    - cron: "20 9 * * *"   # about 5am New York time, after overnight waivers
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/market.mjs", "backend/sleeper.mjs", "backend/inhouse.mjs", "backend/dp.mjs", "backend/managers.mjs", "backend/ffu-values.mjs", "backend/db.mjs", ".github/workflows/market.yml"]
permissions:
  contents: write
concurrency:
  group: data-branch          # shared with the crawl: one data job at a time, queued, never cancelled
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect transactions and values
        env:
          SLEEPER_USERNAME: jahswor
          OUT_DIR: data-branch
        run: node backend/market.mjs
      - name: Expert values (DynastyProcess second opinion)
        env:
          OUT_DIR: data-branch
        run: node backend/dp.mjs
      - name: Fit in-house values
        run: node backend/inhouse.mjs data-branch
      - name: Daily FFU values
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node backend/ffu-values.mjs data-branch
      - name: Manager profiles (trade-day values)
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node backend/managers.mjs data-branch
      - name: Publish data
        run: |
          cd data-branch
          git config user.name "command-center-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "Market data $(date -u +%F)"
          # other jobs (alerts) also write to the data branch: rebase onto theirs and retry
          for i in 1 2 3 4 5; do git push -q && exit 0; git pull -q --rebase origin data || true; sleep $((i*5)); done
          exit 1
