name: Lineup alerts
on:
  schedule:
    - cron: "*/15 * * * 0,1,4"   # Sun, Mon, Thu (UTC); the script picks the New York game-day windows
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test alert right now"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["backend/alerts.mjs", ".github/workflows/alerts.yml"]
permissions:
  contents: write
concurrency:
  group: alerts
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check lineups and send alerts
        env:
          SLEEPER_USERNAME: jahswor
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: https://elijahsworllc.github.io/fantasyfootballmanager/
          STATE_FILE: data-branch/alert-state.json
          FORCE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.test) }}
        run: node backend/alerts.mjs
      - name: Save alert state
        run: |
          cd data-branch
          git config user.name "command-center-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Alert state" && git push)
