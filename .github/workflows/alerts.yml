name: Lineup alerts
on:
  schedule:
    - cron: "*/15 * * * 0,1,4"   # Sun, Mon, Thu (UTC); the script picks the New York game-day windows
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test alert right now"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["backend/alerts.mjs", ".github/workflows/alerts.yml"]
permissions:
  contents: read
concurrency:
  group: alerts
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull data from the private FFU store
        run: node backend/store.mjs pull data-branch --only alert-state.json
      - name: Check lineups and send alerts
        env:
          SLEEPER_USERNAME: jahswor
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: https://fantasyfootballuniverse.com/
          STATE_FILE: data-branch/alert-state.json
          FORCE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.test) }}
        run: node backend/alerts.mjs
      - name: Save alert state
        run: node backend/store.mjs push data-branch
