function ppw(pid, lg, cache){
  if(cache[pid] != null) return cache[pid];
  let s = 0, n = 0, meta = null;
  for(const P of [S.proj, S.proj2 || {}]){ const e = P[pid]; if(!e) continue; meta = meta || e.player;
    if(!e.stats) continue; const v = leagueScore(e.stats, lg.scoring_settings || {}, (e.player||{}).position); if(v > 0.3){ s += v; n++; } }
  const p = meta || {}, st = p.injury_status, m = st && ROS_FACTOR[st] != null ? ROS_FACTOR[st] : 1;
  return cache[pid] = n && (p.team || isNaN(+pid)) ? s/n*m : 0;
}
function eligOf(pid){
  const p = ((S.proj[pid] || (S.proj2||{})[pid]) || {}).player || {};
  const pos = p.position || (isNaN(+pid) ? "DEF" : "?");
  return p.fantasy_positions && p.fantasy_positions.length ? p.fantasy_positions : [pos];
}
// best weekly lineup from a set of player ids
function lineupPts(lg, ids, cache){
  const slots = (lg.roster_positions||[]).filter(p=>p!=="BN" && SLOT_ELIG[p]).sort((a,b)=>SLOT_ELIG[a].length - SLOT_ELIG[b].length);
  const pl = [...new Set(ids)].map(id=>({id, elig:eligOf(id), v:ppw(id, lg, cache)})).sort((a,b)=>b.v-a.v);
  const used = new Set(); let t = 0;
  for(const s of slots){ const e = SLOT_ELIG[s]; const best = pl.find(p=>!used.has(p.id) && p.elig.some(x=>e.includes(x))); if(best){ used.add(best.id); t += best.v; } }
  return {pts:t, starters:used};
}

async function seasonFor(b){
  const lg = b.lg, set = lg.settings || {}, N = b.N;
  const median = set.league_average_match === 1, cache = {};
  const teams = b.teams.map(t=>{
    const r = t.roster, rs = r.settings || {};
    const g = (rs.wins||0) + (rs.losses||0) + (rs.ties||0), wk = median ? g/2 : g;
    const pf = (rs.fpts||0) + (rs.fpts_decimal||0)/100;
    const ids = (r.players||[]).filter(p=>!(r.taxi||[]).includes(p));
    const lu = lineupPts(lg, ids, cache);
    const w = wk/(wk+5);   // early on trust projections, later trust real scoring
    return {rid:t.rid, bp:t, wins:(rs.wins||0) + 0.5*(rs.ties||0), pf, wk, proj:lu.pts, mean: wk ? w*(pf/wk) + (1-w)*lu.pts : lu.pts, ids, starters:lu.starters};
  });
  const played = Math.round(Math.max(0, ...teams.map(t=>t.wk)));
  const playoffStart = set.playoff_week_start || 15, first = (set.start_week || 1) + played;
  const weekNums = []; for(let w = first; w < playoffStart && w <= 18; w++) weekNums.push(w);
  const idx = {}; teams.forEach((t,i)=>idx[t.rid] = i);
  const weeks = await Promise.all(weekNums.map(w=>getJSON(`/v1/league/${lg.league_id}/matchups/${w}`, {cache:"prefer"}).then(arr=>{
    if(!Array.isArray(arr) || !arr.some(m=>m.matchup_id != null)) return null;
    const by = {}; for(const m of arr) if(m.matchup_id != null) (by[m.matchup_id] ||= []).push(idx[m.roster_id]);
    return Object.values(by).filter(p=>p.length===2 && p[0]!=null && p[1]!=null);
  }).catch(()=>null)));
  const fc = await fcValues(fcKey(lg));
  return {b, lg, N, teams, idx, weeks, weekNums, median, playoffTeams: Math.min(set.playoff_teams || 6, N), cache, fc, played};
}

// Monte Carlo: rest of the regular season, then the playoff bracket. adj = {teamIndex: change in weekly points}
function simulate(L, adj, n, seed){
  const r = rng(seed), T = L.teams, N = T.length, P = L.playoffTeams;
  const mean = T.map((t,i)=>t.mean + ((adj && adj[i]) || 0)), sd = mean.map(m=>0.16*Math.max(m,40) + 6);
  const po = new Float64Array(N), bub = new Float64Array(N), title = new Float64Array(N);
  const wins = new Float64Array(N), pf = new Float64Array(N), sc = new Float64Array(N), seedOf = new Int32Array(N);
  const ids = [...Array(N).keys()];
  for(let s = 0; s < n; s++){
    for(let i = 0; i < N; i++){ wins[i] = T[i].wins; pf[i] = T[i].pf; }
    for(const pairs of L.weeks){
      for(let i = 0; i < N; i++){ sc[i] = mean[i] + sd[i]*gauss(r); pf[i] += sc[i]; }
      let pr = pairs;
      if(!pr){ const sh = ids.slice(); for(let i = N-1; i > 0; i--){ const j = Math.floor(r()*(i+1)); [sh[i], sh[j]] = [sh[j], sh[i]]; } pr = []; for(let i = 0; i+1 < N; i += 2) pr.push([sh[i], sh[i+1]]); }
      for(const [a,b] of pr){ if(sc[a] > sc[b]) wins[a]++; else wins[b]++; }
      if(L.median){ const so = Array.from(sc).sort((x,y)=>x-y), med = (so[(N-1)>>1] + so[N>>1])/2; for(let i = 0; i < N; i++) if(sc[i] > med) wins[i]++; }
    }
    const order = ids.slice().sort((a,b)=>wins[b]-wins[a] || pf[b]-pf[a]);
    order.forEach((i,k)=>{ seedOf[i] = k; if(k < P) po[i]++; else if(k === P) bub[i]++; });
    let alive = order.slice(0, P);
    while(alive.length > 1){
      let p2 = 1; while(p2 < alive.length) p2 *= 2;
      const byes = p2 - alive.length, next = alive.slice(0, byes), rest = alive.slice(byes);
      for(let k = 0; k < rest.length/2; k++){ const a = rest[k], b = rest[rest.length-1-k];
        next.push(mean[a] + sd[a]*gauss(r) >= mean[b] + sd[b]*gauss(r) ? a : b); }
      alive = next.sort((a,b)=>seedOf[a]-seedOf[b]);
    }
    if(alive.length) title[alive[0]]++;
  }
  return T.map((t,i)=>({po:po[i]/n, bub:bub[i]/n, title:title[i]/n}));
}

function classify(t, N){
  const o = t.odds, b = t.bp, base = 1/N, futTop = b.futRank <= N/2, aging = b.y2 < b.dyn*0.85;
  const P = o.po, T = o.title;
  if(P >= 0.8 && T >= 1.5*base && futTop) return "stay";
  if(P >= 0.6) return T >= 1.3*base && (!futTop || aging) ? "allin" : "contend";
  if(P <= 0.2) return futTop ? "rebuild" : "teardown";
  if(t.sens != null && ((t.sens >= 0.55 && t.sens - P >= 0.12) || (aging && !futTop && t.sens >= 0.5))) return "push";
  return futTop ? "retool" : "sell";
}

function diagnoseLeague(L){
  const N = L.N, P = L.playoffTeams, T = L.teams;
  const odds = simulate(L, null, 1000, 7);
  const rankBy = f => { const o = T.map((t,i)=>i).sort((a,b)=>f(T[b])-f(T[a])); return i=>o.indexOf(i)+1; };
  const stand = (()=>{ const o = T.map((t,i)=>i).sort((a,b)=>T[b].wins-T[a].wins || T[b].pf-T[a].pf); return i=>o.indexOf(i)+1; })();
  const meanR = rankBy(t=>t.mean), pfR = rankBy(t=>t.pf);
  const opp = T.map(()=>[]);
  for(const pr of L.weeks) if(pr) for(const [a,b] of pr){ opp[a].push(T[b].mean); opp[b].push(T[a].mean); }
  T.forEach((t,i)=>{ t.sos = opp[i].length ? opp[i].reduce((s,v)=>s+v,0)/opp[i].length : null; });
  const sosR = rankBy(t=>t.sos == null ? -1 : t.sos);
  T.forEach((t,i)=>{ t.i = i; t.odds = odds[i]; t.stand = stand(i); t.meanRank = meanR(i); t.pfRank = pfR(i); t.sosRank = t.sos == null ? null : sosR(i); });
  // leverage: what one starter-level upgrade does for teams on the bubble
  const bubble = T.filter(t=>t.odds.po > 0.2 && t.odds.po < 0.6);
  if(bubble.length && L.weeks.length){
    const base = simulate(L, null, 400, 9);
    for(const t of bubble){ const up = simulate(L, {[t.i]:6}, 400, 9)[t.i].po; t.sens = Math.min(1, Math.max(0, t.odds.po + up - base[t.i].po)); }
  }
  T.forEach(t=>t.dir = classify(t, N));
  L.me = T.find(t=>t.rid===L.b.me.rid);
}

async function loadDirection(){
  if(S.dirLoading) return;
  S.dirLoading = true; S.dirError = null; S.dirProgress = 0; S.dirPhase = "Building Blueprints"; render();
  try{
    if(!S.bp) await loadBlueprints();
    S.dirPhase = "Reading trades and next week's projections"; renderStatus();
    const [p2] = await Promise.all([
      S.week < 18 ? getJSON(`${API}/projections/nfl/${S.season}/${S.week+1}?season_type=regular&${PROJ_POS}`).catch(()=>[]) : Promise.resolve([]),
      loadTx().catch(()=>null)
    ]);
    S.proj2 = {}; for(const e of p2||[]) S.proj2[e.player_id] = e;
    const list = (S.bp||[]).filter(b=>b.lg.status==="in_season" && b.me);
    S.dirPhase = "Loading every remaining schedule"; let done = 0;
    const got = await pool(list, 6, async b=>{ const L = await seasonFor(b); S.dirProgress = ++done/list.length; renderStatus(); return L; });
    S.dirPhase = "Simulating the rest of the season"; renderStatus();
    const leagues = {};
    let k = 0; S.dirProgress = 0;
    for(const L of got){ k++; if(!L || L.error) continue; diagnoseLeague(L); leagues[L.lg.league_id] = L; S.dirProgress = k/got.length; renderStatus(); await new Promise(r=>setTimeout(r, 0)); }
    S.dir = {leagues};
  }catch(e){ S.dirError = "Couldn't build directions: " + (e.message||e); }
  S.dirLoading = false; render();
}

/* ---------- trade finder: offers that move your team in its direction ---------- */
const pmOf = arr => Math.pow(arr.reduce((s,a)=>s + Math.pow(Math.max(a.v,0), 1.3), 0), 1/1.3);
const sumV = arr => arr.reduce((s,a)=>s+a.v, 0);
function assetsOf(L, t){
  if(t._assets) return t._assets;
  const players = t.bp.pl.map(p=>({k:p.id, id:p.id, name:p.name, pos:p.pos, v:p.v, r:p.r, age:p.age, trend:p.trend||0,
    young:!!isYoung(p), old:!!isOld(p), pts:ppw(p.id, L.lg, L.cache), starter:t.starters.has(p.id), cb:true}));
  const picks = t.bp.picks.filter(p=>p.round<=3 && p.val>0).map(p=>{ const n = pickName(p, L.fc);
    return {k:`pk${p.season}-${p.round}-${p.orig}`, id:"PICK:"+(n||pickLabel(p)), name:pickLabel(p)+(p.mine?"":" (via trade)"), pos:"PICK", v:p.val, young:true, pts:0, cb:!!n}; });
  return t._assets = {players, picks};
}
function bestPackage(pool, lo, hi, cost){
  const P = pool.slice(0, 13); let best = null, bc = Infinity;
  const check = pkg => { const m = pmOf(pkg); if(m < lo || m > hi) return; const c = cost(pkg, m); if(c < bc){ bc = c; best = pkg; } };
  for(let i = 0; i < P.length; i++){ check([P[i]]);
    for(let j = i+1; j < P.length; j++){ check([P[i],P[j]]);
      for(let k = j+1; k < P.length; k++) check([P[i],P[j],P[k]]); } }
  return best;
}
function evalTrade(L, me, them, give, get){
  const gIds = give.filter(a=>a.pos!=="PICK").map(a=>a.id), rIds = get.filter(a=>a.pos!=="PICK").map(a=>a.id);
  const myIds = me.ids.filter(id=>!gIds.includes(id)).concat(rIds), thIds = them.ids.filter(id=>!rIds.includes(id)).concat(gIds);
  const dMe = lineupPts(L.lg, myIds, L.cache).pts - me.proj, dTh = lineupPts(L.lg, thIds, L.cache).pts - them.proj;
  const base = L.base800 ||= simulate(L, null, 800, 11);
  const after = simulate(L, {[me.i]:dMe, [them.i]:dTh}, 800, 11);
  const yv = arr => arr.filter(a=>a.young).reduce((s,a)=>s+a.v, 0);
  const myY = me.bp.young - yv(give) + yv(get), thY = them.bp.young - yv(get) + yv(give);
  const rest = L.teams.filter(t=>t!==me && t!==them).map(t=>t.bp.young);
  const futRank = (v, other) => 1 + rest.filter(x=>x > v).length + (other > v ? 1 : 0);
  // report as the headline odds plus the simulated change, so every number on the screen agrees
  const clamp = x => Math.max(0, Math.min(1, x)), shift = (t, k) => [t.odds[k], clamp(t.odds[k] + after[t.i][k] - base[t.i][k])];
  const [mp0, mp1] = shift(me, "po"), [mt0, mt1] = shift(me, "title"), [tp0, tp1] = shift(them, "po");
  return {give, get, them, dMe, dTh, giveV:pmOf(give), getV:pmOf(get),
    me:{po0:mp0, po1:mp1, t0:mt0, t1:mt1, y0:me.bp.young, y1:myY, f0:me.bp.futRank, f1:futRank(myY, thY)},
    th:{po0:tp0, po1:tp1, y0:them.bp.young, y1:thY, f0:them.bp.futRank, f1:futRank(thY, myY)}};
}
function acceptance(ev, mode, act){
  const t = ev.them, buyer = BUYERS.has(t.dir), ratio = ev.giveV / Math.max(ev.getV, 1);   // what they get / what they give
  let z = -0.3 + 3.5*Math.max(-0.4, Math.min(0.4, ratio - 1));
  if(mode==="sell" && buyer) z += 0.5 + 4*(ev.th.po1 - ev.th.po0);
  if(mode==="buy" && !buyer) z += 0.5 + 2*Math.max(0, (ev.th.y1 - ev.th.y0)/Math.max(ev.th.y0, 1));
  if(mode==="buy" && buyer) z -= 0.6;
  const a = act[t.rid] || {trades:0, moves:0, last:0};
  z += Math.min(0.6, 0.25*a.trades) + (a.last && Date.now()-a.last < 14*864e5 ? 0.25 : 0) - (a.moves ? 0 : 1.2);
  ev.act = a;
  return Math.max(0.05, Math.min(0.9, 1/(1+Math.exp(-z))));
}
function buildDetail(L){
  L.base800 ||= simulate(L, null, 800, 11);
  const me = L.me, act = teamActivity(L.lg.league_id), others = L.teams.filter(t=>t!==me), lg = L.lg;
  const mine = assetsOf(L, me), CORE = ["QB","RB","WR","TE"];
  const myTop2 = new Set(mine.players.slice().sort((a,b)=>b.v-a.v).slice(0,2).map(a=>a.k));
  // BUY: players who raise your weekly lineup, paid for with bench pieces and picks
  const payPool = mine.players.filter(a=>!a.starter && !myTop2.has(a.k) && a.v >= 150).concat(mine.picks).sort((a,b)=>b.v-a.v);
  let cands = [];
  for(const t of others){ const A = assetsOf(L, t), top = A.players.slice().sort((a,b)=>b.v-a.v)[0];
    const per = [];
    for(const p of A.players){ if(!CORE.includes(p.pos) || p.pts < 4) continue;
      const gain = lineupPts(lg, me.ids.concat(p.id), L.cache).pts - me.proj; if(gain < 1.5) continue;
      per.push({t, p, gain, w: gain - (BUYERS.has(t.dir) ? 3 : 0) - (p===top ? 2 : 0)}); }
    cands.push(...per.sort((a,b)=>b.w-a.w).slice(0,2)); }
  const buy = [];
  for(const c of cands.sort((a,b)=>b.w-a.w).slice(0,14)){
    const T = c.p.v, seller = !BUYERS.has(c.t.dir);
    const pkg = bestPackage(payPool, T*0.98, T*1.3, (k,m)=>Math.abs(m/(T*1.08)-1) + 0.05*(k.length-1) - (seller ? 0.03*k.filter(a=>a.young).length : 0));
    if(!pkg) continue;
    const ev = evalTrade(L, me, c.t, pkg, [c.p]); ev.mode = "buy"; ev.acc = acceptance(ev, "buy", act);
    ev.gainMe = (ev.me.po1-ev.me.po0) + 2*(ev.me.t1-ev.me.t0);
    if(ev.gainMe > 0.005) buy.push(ev);
  }
  // SELL: aging starters to teams that need them, for young players and picks
  let pieces = mine.players.filter(a=>a.r >= 700 && (a.old || (a.age && a.age >= 26))).sort((a,b)=>b.r-a.r).slice(0,4);
  if(!pieces.length) pieces = mine.players.filter(a=>a.starter && !a.young && a.r >= 700).sort((a,b)=>b.r-a.r).slice(0,2);
  const sell = [];
  for(const piece of pieces){
    const opts = [];
    for(const t of others){ if(!BUYERS.has(t.dir) && t.odds.po < 0.35) continue;   // only teams playing for this season pay for veterans
      const gain = lineupPts(lg, t.ids.concat(piece.id), L.cache).pts - t.proj; if(gain < 1) continue;
      opts.push({t, gain, w: gain*(BUYERS.has(t.dir) ? 1.5 : 1)}); }
    for(const o of opts.sort((a,b)=>b.w-a.w).slice(0,3)){
      const A = assetsOf(L, o.t), top2 = new Set(A.players.slice().sort((a,b)=>b.v-a.v).slice(0,2).map(a=>a.k));
      const ask = A.players.filter(a=>!a.starter && a.young && a.v >= 150 && !top2.has(a.k)).concat(A.picks).sort((a,b)=>b.v-a.v);
      const V = piece.v;
      const pkg = bestPackage(ask, V*0.85, V*1.12, (k,m)=>Math.abs(m/V-1) + 0.04*(k.length-1));
      if(!pkg) continue;
      const ev = evalTrade(L, me, o.t, [piece], pkg); ev.mode = "sell"; ev.acc = acceptance(ev, "sell", act);
      ev.gainMe = (ev.me.y1-ev.me.y0)/Math.max(ev.me.y0, 1);
      if(ev.gainMe > 0.01) sell.push(ev);
    }
  }
  const pick = list => { const out = [], per = {}, used = new Set();
    for(const ev of list.sort((a,b)=>b.gainMe*(0.35+b.acc) - a.gainMe*(0.35+a.acc))){
      const key = ev.give.concat(ev.get).map(a=>a.k).join("|"), main = (ev.get[0]||{}).k + ">" + (ev.give[0]||{}).k;
      const core = (ev.mode==="sell" ? ev.give[0] : ev.get[0]).k;
      if((per[ev.them.rid]||0) >= 2 || used.has(main) || (per["a"+core]||0) >= 2) continue;
      per[ev.them.rid] = (per[ev.them.rid]||0) + 1; per["a"+core] = (per["a"+core]||0) + 1; used.add(main); used.add(key); out.push(ev); if(out.length >= 6) break; }
    return out; };
  return {buy: pick(buy), sell: pick(sell), primary: DIR[me.dir].mode};
}

/* ---------- direction: words ---------- */
function headline(L, t){
  const o = t.odds, b = t.bp, N = L.N, weak = ["QB","RB","WR","TE"].slice().sort((x,y)=>b.posRank[y]-b.posRank[x])[0];
  switch(t.dir){
    case "stay": return `${pct(o.po)} playoff odds, ${pct(o.title)} to win it, and your future value ranks ${ord(b.futRank)}. You're built for now and later. Only add depth.`;
    case "allin": return `${pct(o.title)} title odds, ${(o.title*N).toFixed(1)}× the league average, with a roster that ${b.y2 < b.dyn*0.85 ? "is aging" : "ranks " + ord(b.futRank) + " in future value"}. This is your window. Trade picks and prospects for points.`;
    case "contend": return `${pct(o.po)} playoff odds. Your weakest spot is ${weak} (${b.grades[weak]}). Fixing it is how you raise your ${pct(o.title)} title odds.`;
    case "push": return `You're a coin flip for the playoffs (${pct(o.po)}) and one starter-level upgrade takes you to ${pct(t.sens)}. Buy now while it still counts.`;
    case "retool": return `${pct(o.po)} playoff odds and ${pct(o.title)} to win it, but your young core ranks ${ord(b.futRank)} of ${N}. Sell aging starters while contenders still pay for them.`;
    case "sell": return `${pct(o.po)} playoff odds, ${pct(o.title)} to win it, and future value ${ord(b.futRank)} of ${N}. Standing still lands you just outside the money. Cash out vets for youth and picks.`;
    case "rebuild": return `${pct(o.po)} playoff odds, but future value ranks ${ord(b.futRank)} of ${N}. Keep selling vets for youth and picks.`;
    default: return `${pct(o.po)} playoff odds and future value ${ord(b.futRank)} of ${N}. Sell every veteran with value and restart around youth and picks.`;
  }
}
function confidence(t){
  const P = t.odds.po, m = Math.min(...[0.2, 0.6, 0.8].map(x=>Math.abs(P-x)));
  return m < 0.05 ? "Close call" : m < 0.12 ? "Lean" : "Clear call";
}
function whyLines(L, t){
  const N = L.N, o = t.odds, P = L.playoffTeams, b = t.bp, out = [];
  const firstOut = L.teams.find(z=>z.stand===P+1), lastIn = L.teams.find(z=>z.stand===P);
  const gb = t.stand <= P ? (firstOut ? (t.wins-firstOut.wins ? `${games(t.wins-firstOut.wins)} ahead of the first team out` : "tied in wins with the first team out") : "")
                          : (lastIn ? (lastIn.wins-t.wins ? `${games(lastIn.wins-t.wins)} behind the last playoff spot` : "tied in wins with the last playoff spot, behind on points") : "");
  out.push(["Standings", `${b.rec}, ${ord(t.stand)} of ${N}${gb?" · "+gb:""} · ${ord(t.pfRank)} in points scored`]);
  out.push(["Strength", `About ${fmt(t.mean)} pts a week from here, ${ord(t.meanRank)} best. Blends your real scoring with your best lineup's projections.`]);
  if(t.sos != null) out.push(["Schedule", `${L.weeks.length} game${L.weeks.length===1?"":"s"} left, ${t.sosRank===1?"the":ord(t.sosRank)} hardest schedule (opponents average ${fmt(t.sos)})`]);
  else if(!L.weeks.length) out.push(["Schedule", "Regular season is over"]);
  out.push(["Odds", `${pct(o.po)} to make the top ${P} · ${pct(o.bub)} to finish ${ord(P+1)}, first team out · ${pct(o.title)} to win the title (average ${pct(1/N)})`]);
  if(t.sens != null) out.push(["Leverage", `One starter-level upgrade (+6 pts a week) moves your playoff odds from ${pct(o.po)} to ${pct(t.sens)}`]);
  const chg = (b.y2 - b.dyn)/Math.max(b.dyn, 1);
  out.push(["Window", `Future value ${ord(b.futRank)} of ${N} · value-weighted age ${b.age.toFixed(1)} · held as is, the roster ${chg<0?"loses":"gains"} about ${Math.abs(Math.round(chg*100))}% of its value over 2 seasons`]);
  const firsts = b.picks.filter(p=>p.round===1).length;
  out.push(["Assets", `${firsts} first-round pick${firsts===1?"":"s"} over the next 3 drafts · ${["QB","RB","WR","TE"].map(p=>p+" "+b.grades[p]).join(", ")}`]);
  return out;
}
function pitchText(ev, mode){
  const t = ev.them, b = t.bp, buyer = BUYERS.has(t.dir);
  const list = arr => arr.map(a=>a.name).join(" + ");
  const s = [`Hey ${b.name}, ${buyer ? `you're ${b.rec} and in the race.` : "looks like you're building toward next year."} ${mode==="buy" ? "I'm making a push this season." : "I'm retooling for next year."}`];
  s.push(`Would you do ${list(ev.give)} for ${list(ev.get)}?`);
  if(ev.th.po1 - ev.th.po0 >= 0.03) s.push(`By my projections it adds about ${fmt(ev.dTh)} points a week to your lineup and takes your playoff odds from ${pct(ev.th.po0)} to ${pct(ev.th.po1)}.`);
  const yg = ev.give.filter(a=>a.young);
  if(!buyer && yg.length) s.push(`You'd get ${yg.map(a=>a.pos==="PICK" ? a.name.replace(" (via trade)","") : `${a.name}${a.age?` (${Math.floor(a.age)})`:""}`).join(" and ")}, which fits where your roster is headed.`);
  if(ev.giveV >= ev.getV*0.98) s.push(`On FantasyCalc you come out ahead: ${Math.round(sumV(ev.give)).toLocaleString()} in value for ${Math.round(sumV(ev.get)).toLocaleString()}.`);
  s.push("Open to a counter if you want to tweak it.");
  return s.join(" ");
}
function marketLines(ev, mode){
  const out = [];
  for(const a of ev.get.concat(ev.give)){ if(a.pos==="PICK" || !a.v) continue;
    const tr = a.trend/a.v, buying = ev.get.includes(a);
    if(buying && tr <= -0.05) out.push(`${a.name}'s value is down ${Math.round(-tr*100)}% in 30 days: buy-low window.`);
    if(!buying && tr >= 0.05) out.push(`${a.name}'s value is up ${Math.round(tr*100)}% in 30 days: sell-high window.`);
    if(!buying && tr <= -0.08) out.push(`${a.name}'s value is down ${Math.round(-tr*100)}% in 30 days. Sell before it drops further.`);
    const m = marketFor(a.id);
    if(m.length) out.push(`${a.name}: traded ${m.length}× in your leagues this season. Latest, ${new Date(m[0].ts).toLocaleDateString([], {month:"short", day:"numeric"})}: cost ${m[0].paid.join(", ") || "nothing listed"}.`);
  }
  return out.slice(0, 3);
}

/* ---------- today: what matters right now ---------- */
function todayCard(){
  const now = new Date(new Date().toLocaleString("en-US", {timeZone:"America/New_York"})), d = now.getDay(), hr = now.getHours();
  const crit = S.results.filter(r=>r.sev==="crit").length;
  if(d===2 || d===3 && hr < 12 || d===1 && hr >= 23) return {title:"Waiver night", text:"Most of your leagues process claims overnight. Set bids before you go to bed.", tab:"waivers", cta:"Open waivers"};
  if(d===4) return {title:"Thursday kickoff", text:`${crit} league${crit===1?"":"s"} still have a starter who can't play. Fix Thursday players first; they lock tonight.`, tab:"queue", cta:"Fix lineups"};
  if(d===5 || d===6) return {title:"Trade window", text:"Injury news is mostly in. Good time to make offers before Sunday.", tab:"direction", cta:"See directions"};
  if(d===0) return {title:"Game day", text:`${crit} league${crit===1?"":"s"} need a fix. Check Questionable players about 90 minutes before kickoff.`, tab:"queue", cta:"Fix lineups"};
  return {title:"Monday", text:"Last game tonight. Waivers open after it ends.", tab:"waivers", cta:"Preview waivers"};
}

function exposure(){
  const map = {};
  for(const r of S.results){ if(!r.roster || r.sev==="off") continue;
    const reserve = new Set(r.roster.reserve||[]), taxi = new Set(r.roster.taxi||[]), st = new Set(r.current||[]), opt = new Set(r.opt||[]);
    for(const p of r.roster.players||[]){
      const f = r._c[p] || (r._c[p] = pinfo(p, r.league));
      const e = map[p] ||= {f, leagues:[], start:0, bench:0, wrong:0};
      const role = st.has(p) ? "Starting" : reserve.has(p) ? "IR" : taxi.has(p) ? "Taxi" : "Bench";
      if(role==="Starting") e.start++; if(role==="Bench") e.bench++;
      const shouldStart = opt.has(p);
      if((role==="Starting") !== shouldStart && role!=="IR" && role!=="Taxi" && !f.locked) e.wrong++;
      e.leagues.push({r, role, shouldStart, pts: f.eff});
    }

}

      else if(words.includes(p.last)) s = 40 + (words.includes(p.first) ? 30 : 0);
      else if(words.some(w=>w.length >= 4 && p.last.startsWith(w))) s = 20;
      if(!s) continue;
      s += (p.mine ? 15 : 0) + Math.min(10, p.pts/2);
      if(s > bs){ bs = s; best = p; }
    }
    if(best && !out.some(o=>o.id === best.id)) out.push({id:best.id, name:pname(best.id)});
  }
  return out;
}

/* ---------- weekly brief ---------- */
function makeBrief(){
  const groups = outGroups().filter(g=>g.key !== "empty"), live = S.results.filter(r=>r.sev !== "off");
  const matches = live.filter(r=>r.match), proj = r => r.moves ? r.match.meOpt : r.match.me, wins = matches.filter(r=>proj(r) > r.match.opp).length, flips = matches.filter(r=>Math.abs(proj(r) - r.match.opp) <= 5).length;
  const fixes = live.filter(r=>r.sev === "crit").length, bench = live.reduce((s,r)=>s + (r.moves && r.gain > 0 ? r.gain : 0), 0);
  const q = {}; for(const r of live){ if(!r.current) continue; for(const pid of r.current){ const f = r._c[pid]; if(f && !f.locked && f.status === "Questionable"){ (q[pid] ||= {f, n:0, subs:0}).n++; if((r.league.settings||{}).max_subs) q[pid].subs++; } } }
  const qTop = Object.values(q).sort((a,b)=>b.n-a.n)[0], top = groups.slice().sort((a,b)=>b.rows.length-a.rows.length)[0];
  const rate = matches.length ? wins/matches.length : 0;
  let title, story;
  if(top && top.rows.length >= 3){ title = `The ${top.f.full.split(" ").slice(-1)[0]} fallout`; story = `${top.f.full} is ${statusLabel(top.f).toLowerCase()} and he starts in ${top.rows.length} of your lineups. That one name is the story of your week.`; }
  else if(fixes >= 4){ title = "Crunch-time cleanup"; story = `${fixes} lineups have a starter who can't play. None of it is hard, but all of it has a clock on it.`; }
  else if(matches.length && flips >= matches.length/3){ title = "Coin-flip week"; story = `${flips} of your ${matches.length} matchups are projected within 5 points. Small edges on your benches decide this one.`; }
  else if(rate >= .6){ title = "Favored and focused"; story = `You're projected to outscore your opponent in ${wins} of ${matches.length} matchups. Protect the leads: clean up the few problem lineups and let the favorites play.`; }
  else { title = "Grind week"; story = `You're projected to outscore your opponent in ${wins} of ${matches.length} matchups. Every bench point you move into a lineup matters this week.`; }
  story += ` ${fmt(bench)} projected points are sitting on your benches.`;
  const items = [];
  if(top) items.push({title:`${top.f.full} is ${statusLabel(top.f) === "Bye" ? "on bye" : statusLabel(top.f).toLowerCase()}`, body:(()=>{ const n = top.rows.length, ok = top.rows.filter(x=>x.sub).length, no = n - ok; return `He starts in ${n} lineup${n>1?"s":""}. ` + (n === 1 ? (ok ? "There's a clean swap on your bench." : "There's no healthy swap on your bench, so it needs a waiver add.") : `${ok} ha${ok===1?"s":"ve"} a clean swap on the bench${no?`, ${no} need${no===1?"s":""} a waiver add`:""}.`); })(), cta:`Fix ${fixes} lineup${fixes===1?"":"s"}`, go:"fix", tab:"fix"});
  if(qTop) items.push({title:`${qTop.f.full} is a game-time call`, body:`Questionable in ${qTop.n} league${qTop.n>1?"s":""}. ${qTop.subs ? `${qTop.subs} allow auto-subs, so set them now; the rest need a check before kickoff.` : "None of those leagues allow auto-subs, so check before kickoff."}`, cta:"See every Questionable starter", go:"fix", tab:"monitor"});
  if(bench >= 1) items.push({title:`${fmt(bench)} points on your benches`, body:`Better lineups are available in ${live.filter(r=>r.moves && r.gain>0).length} leagues, scored with each league's own settings.`, cta:"See the swaps", go:"fix", tab:"startsit"});
  if(items.length < 3 && S.bp){ const weak = {}; for(const b of S.bp) for(const p of ["QB","RB","WR","TE"]) if(["D","F"].includes(b.me.grades[p])) weak[p] = (weak[p]||0)+1;
    const w = Object.entries(weak).sort((a,b)=>b[1]-a[1])[0]; if(w) items.push({title:`${w[0]} is your thinnest spot`, body:`Graded D or F in ${w[1]} leagues. It's the position to target in trades and on waivers.`, cta:"Open waivers", go:"waivers"}); }
  let long = null;
  const tl = teamList().filter(x=>x.b);
  if(tl.length){ const undecided = tl.filter(x=>x.dir === "none").length, rb = tl.filter(x=>x.dir === "rebuild").length, ct = tl.filter(x=>x.dir === "contend").length;
    long = `${ct} teams are set up to contend, ${rb} to rebuild, and ${undecided} are undecided. Undecided teams lose value every season, so give each one a direction.`; }
  return {title, story, wins, n:matches.length, fixes, flips, items:items.slice(0,3), long, at:new Date()};
}

/* ---------- trade recs for one league ---------- */
async function ensureSim(lid){
  const st = S.sim[lid] ||= {};
  if(st.busy || st.detail || st.error) return;
  st.busy = true; st.phase = "Loading team values"; render();
  const pre = S.dir && S.dir.leagues && S.dir.leagues[lid];
  if(pre){ st.phase = `Testing trades against ${pre.N-1} league mates`; await sleep(30); try{ st.L = pre; st.detail = buildDetail(pre); }catch(e){ st.error = e.message || String(e); } st.busy = false; render(); return; }
  try{
    while(S.bpLoading) await sleep(250);
    if(!S.bp) await loadBlueprints();
    const b = (S.bp||[]).find(z=>z.lg.league_id === lid);
    if(!b) throw new Error("This league doesn't have enough roster data for trade recs yet.");
    if(b.lg.status !== "in_season") throw new Error("Trade recs run once the season is underway.");
    st.phase = "Reading next week's projections and league trades"; render();
    if(!S.proj2){ const p2 = S.week < 18 ? await getJSON(`${API}/projections/nfl/${S.season}/${S.week+1}?season_type=regular&${PROJ_POS}`).catch(()=>[]) : []; S.proj2 = {}; for(const e of p2||[]) S.proj2[e.player_id] = e; }
    await loadTx().catch(()=>null);
    st.phase = "Simulating the rest of the season"; render();
    const L = await seasonFor(b);
    diagnoseLeague(L); st.L = L;
    st.phase = `Testing trades against ${L.N-1} league mates`; render();
    await sleep(30);
    st.detail = buildDetail(L);
  }catch(e){ st.error = e.message || String(e); }
  st.busy = false; render();
}
function recsFor(D, dir){
  if(dir === "contend") return D.buy.slice(0,3).map(e=>[e,"buy"]);
  if(dir === "rebuild") return D.sell.slice(0,3).map(e=>[e,"sell"]);
  return [[D.buy[0],"buy"],[D.sell[0],"sell"],[D.buy[1],"buy"],[D.sell[1],"sell"]].filter(x=>x[0]).slice(0,3);
}

}
function trBp(){ return (S.bp||[]).find(z=>z.lg.league_id === TR.lid) || null; }
function trAssets(team){

  h += `<section class="roster glass"><div class="rsec">Starters<span>${r.slots ? fmt(r.projCur) : ""} proj</span></div>${(r.slots||[]).map((s,i)=>rosterRow(r, r.current[i], s, ov, ov.weak)).join("")}
    <div class="rsec">Bench</div>${bench.map(p=>rosterRow(r, p, "BN", ov, [])).join("")}
    ${taxi.size ? `<div class="rsec">Taxi</div>${[...taxi].map(p=>rosterRow(r, p, "TX", ov, [])).join("")}` : ""}
    ${reserve.size ? `<div class="rsec">IR</div>${[...reserve].map(p=>rosterRow(r, p, "IR", ov, [])).join("")}` : ""}
    <p class="src" style="padding:0 14px 12px;margin:0">Points: this week's Sleeper projection in this league's scoring. Small number: FantasyCalc dynasty value. Tags come from the trade finder, 30-day value trends, age and your direction.</p></section>`;
  // trades
  h += `<section id="trades" style="display:flex;flex-direction:column;gap:10px"><div class="sec"><h2 class="h2">Trades that fit</h2><span class="sub">${DIR3[x.dir]}</span></div>`;
  if(!st || st.busy) h += `<div class="skel" aria-hidden="true"><i style="height:150px"></i><i style="height:150px"></i></div>`;
  else if(st.error) h += `<div class="empty">${esc(st.error)}</div>`;
  else h += ov.recs.length ? ov.recs.map(([ev,mode],i)=>recHTML(st.L, ev, mode, i)).join("") : `<div class="empty">No clean trades found in this league right now.</div>`;
  h += `</section>`;
  if(ov.targets.length) h += `<section class="steps glass"><div class="lab">Players to trade for</div>${ov.targets.slice(0,5).map(z=>`<div class="rrow">${headshot(z.a.id,"mini")}<span class="t"><b>${esc(z.a.name)}</b><small>${z.a.pos}${z.a.age ? " · " + Math.floor(z.a.age) : ""} · on ${esc(z.team)}</small></span><span class="rv"><b>${Math.round(z.a.v).toLocaleString()}</b><small>value</small></span></div>`).join("")}</section>`;
  return h;
}

   Accounts: "take control of your command center"
   Supabase auth (email or phone + password) and one private row of saved settings per user,
   spoken to directly over its REST endpoints. Hidden until the project key is set.
   ===================================================================== */
const SB_URL = "https://uxqevvuqibqvypwpccjz.supabase.co";
const SB_KEY = window.CC_SB_KEY ?? "sb_publishable_wclXgOusrUUgopfTF_K-NQ_enryoOh8";   // publishable (client-safe) key
const ACC = {session:null, sheet:null, msg:null, msgKind:"", busy:false, remember: store.get("auth:remember", true), show:false, pendingPhone:null, delArm:false, syncedAt:null};
const accountsOn = () => !!SB_KEY;
const SYNC_KEY = /^(username|threshold|hideDone|sort|dir:|done:|rk:)/;

/* ---------- session storage: "stay signed in" keeps it in localStorage, otherwise only for this visit ---------- */
function authLoad(){ for(const s of [localStorage, sessionStorage]){ try{ const v = s.getItem("cc:auth"); if(v) return JSON.parse(v); }catch(_){} } return null; }
function authSave(sess){
  try{ localStorage.removeItem("cc:auth"); sessionStorage.removeItem("cc:auth"); }catch(_){}
  if(!sess) return;
  try{ (ACC.remember ? localStorage : sessionStorage).setItem("cc:auth", JSON.stringify(sess)); }catch(_){}
}
function setSession(j){
  if(!j || !j.access_token){ ACC.session = null; authSave(null); return; }
  ACC.session = {access_token:j.access_token, refresh_token:j.refresh_token, expires_at: j.expires_at || Math.floor(Date.now()/1000) + (j.expires_in || 3600), user: j.user || (ACC.session && ACC.session.user)};
  authSave(ACC.session);
}
const accName = () => { const u = ACC.session && ACC.session.user; return u ? (u.email || (u.phone ? "+" + String(u.phone).replace(/^\+/,"") : "your account")) : ""; };

/* ---------- REST ---------- */
async function sb(path, {method="GET", body, auth=true, headers={}} = {}){
  if(auth && ACC.session && ACC.session.expires_at - 60 < Date.now()/1000) await sbRefresh();
  const h = {apikey: SB_KEY, "Content-Type":"application/json", ...headers};
  if(auth && ACC.session) h.Authorization = "Bearer " + ACC.session.access_token;   // publishable keys are not JWTs: only send a user token
  const r = await fetch(SB_URL + path, {method, headers:h, body: body == null ? undefined : JSON.stringify(body)});
  const text = await r.text(); let j = null; try{ j = text ? JSON.parse(text) : null; }catch(_){}
  if(!r.ok){ const m = j && (j.error_description || j.msg || j.message || j.error) || ("Error " + r.status); const e = new Error(m); e.status = r.status; e.code = j && (j.error_code || j.code); throw e; }
  return j;
}
async function sbRefresh(){
  if(!ACC.session || !ACC.session.refresh_token) return;
  try{ const j = await fetch(SB_URL + "/auth/v1/token?grant_type=refresh_token", {method:"POST", headers:{apikey:SB_KEY, "Content-Type":"application/json"}, body: JSON.stringify({refresh_token: ACC.session.refresh_token})}).then(r=>r.ok ? r.json() : Promise.reject(r.status));
    setSession(j); }
  catch(e){ if(e === 400 || e === 401){ setSession(null); } }
}
function friendly(e){
  const m = String(e && e.message || e || "");
  if(/invalid login credentials/i.test(m)) return "That login and password don't match.";
  if(/already registered|already exists/i.test(m)) return "There's already an account with that. Sign in instead.";
  if(/phone.*(provider|disabled|not.*enabled)|sms|unsupported phone/i.test(m)) return "Phone sign-in isn't switched on yet. Use your email for now.";
  if(/email not confirmed/i.test(m)) return "Confirm your email first: open the link we sent you.";
  if(/rate limit|too many/i.test(m)) return "Too many tries. Wait a minute and try again.";
  if(/password.*(short|least|weak)/i.test(m)) return "That password is too short. Use at least 8 characters.";
  if(/failed to fetch|network/i.test(m)) return "Couldn't reach the account service. Check your connection.";
  if(/token.*(expired|invalid)|otp/i.test(m)) return "That code didn't work. Check it, or send a new one.";
  return m;
}
function loginId(raw){
  const v = (raw||"").trim();
  if(v.includes("@")) return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? {email: v.toLowerCase()} : null;
  const d = v.replace(/[^\d+]/g, ""), digits = d.replace(/\D/g, "");
  if(digits.length < 10) return null;
  return {phone: d.startsWith("+") ? "+" + digits : digits.length === 10 ? "+1" + digits : "+" + digits};
}
function pwScore(p){ let s = 0; if(p.length >= 8) s++; if(p.length >= 12) s++; if(/[a-z]/.test(p) && /[A-Z]/.test(p)) s++; if(/\d/.test(p)) s++; if(/[^A-Za-z0-9]/.test(p)) s++; return s; }

/* ---------- sync: your saved settings follow you ---------- */
function localSyncData(){ const out = {}; try{ for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(!k || !k.startsWith("cc:")) continue; const kk = k.slice(3); if(SYNC_KEY.test(kk)) out[kk] = JSON.parse(localStorage.getItem(k)); } }catch(_){} return out; }
let pushTimer = null;
function schedulePush(){ clearTimeout(pushTimer); pushTimer = setTimeout(pushState, 1500); }
async function pushState(){
  if(!ACC.session) return;
  try{ await sb("/rest/v1/user_state", {method:"POST", headers:{Prefer:"resolution=merge-duplicates,return=minimal"}, body:{user_id: ACC.session.user.id, data: localSyncData(), updated_at: new Date().toISOString()}});
    ACC.syncedAt = new Date(); if(ACC.sheet === "account") renderSheet(); }
  catch(e){ if(e.status === 401) setSession(null); }
}
async function pullState(){
  if(!ACC.session) return;
  const rows = await sb("/rest/v1/user_state?select=data,updated_at&user_id=eq." + ACC.session.user.id);
  const row = rows && rows[0], before = S.username;
  if(row && row.data) for(const [k,v] of Object.entries(row.data)) if(SYNC_KEY.test(k)) try{ localStorage.setItem("cc:" + k, JSON.stringify(v)); }catch(_){}
  S.username = store.get("username", S.username); S.threshold = store.get("threshold", S.threshold); S.hideDone = store.get("hideDone", S.hideDone); S.sort = store.get("sort", S.sort);
  RK.mode = store.get("rk:mode", RK.mode); RK.qb = store.get("rk:qb", RK.qb);
  await pushState();
  if(S.username && (S.username !== before || !S.results.length) && !S.loading){ S.userId = null; S.lastKey = null; loadAll(null); }
  else render();
}
const _set = store.set.bind(store);
store.set = (k, v) => { _set(k, v); if(ACC.session && SYNC_KEY.test(k)) schedulePush(); };

/* ---------- actions ---------- */
async function accSubmit(kind){
  if(ACC.busy) return;
  const idEl = $("acId"), pwEl = $("acPw"), rm = $("acRemember");
  if(rm){ ACC.remember = rm.checked; _set("auth:remember", ACC.remember); }
  ACC.msg = null; ACC.busy = true; renderSheet();
  try{
    if(kind === "create" || kind === "signin"){
      const who = loginId(idEl.value), pw = pwEl.value;
      if(!who) throw new Error("Enter an email address or a phone number with area code.");
      if(kind === "create" && pw.length < 8) throw new Error("Use at least 8 characters for your password.");
      if(kind === "create"){
        const j = await sb("/auth/v1/signup?redirect_to=" + encodeURIComponent(location.origin + location.pathname), {method:"POST", auth:false, body:{...who, password:pw}});
        if(j && j.access_token){ setSession(j); await accSignedIn("Account created. Your command center now follows you."); return; }
        if(who.phone){ ACC.pendingPhone = who.phone; ACC.sheet = "verify"; ACC.msg = `We texted a 6-digit code to ${who.phone}.`; ACC.msgKind = "info"; }
        else { ACC.sheet = "signin"; ACC.msg = `Almost there: open the link we sent to ${who.email} to confirm, then sign in.`; ACC.msgKind = "info"; }
      } else {
        const j = await sb("/auth/v1/token?grant_type=password", {method:"POST", auth:false, body:{...who, password:pw}});
        setSession(j); await accSignedIn("Signed in. Your command center is synced."); return;
      }
    } else if(kind === "verify"){
      const j = await sb("/auth/v1/verify", {method:"POST", auth:false, body:{type:"sms", phone: ACC.pendingPhone, token: $("acCode").value.trim()}});
      setSession(j); await accSignedIn("Phone verified. Your command center now follows you."); return;
    } else if(kind === "reset"){
      const who = loginId(idEl.value); if(!who || !who.email) throw new Error("Enter the email on your account.");
      await sb("/auth/v1/recover?redirect_to=" + encodeURIComponent(location.origin + location.pathname), {method:"POST", auth:false, body:{email: who.email}});
      ACC.msg = `If there's an account for ${who.email}, a reset link is on its way.`; ACC.msgKind = "info";
    } else if(kind === "newpw"){
      const pw = pwEl.value; if(pw.length < 8) throw new Error("Use at least 8 characters.");
      await sb("/auth/v1/user", {method:"PUT", body:{password: pw}});
      ACC.sheet = null; toast("Password updated.");
    }
  }catch(e){ ACC.msg = friendly(e); ACC.msgKind = "err"; }
  ACC.busy = false; renderSheet();
}
async function accSignedIn(msg){
  ACC.busy = false; ACC.sheet = null; ACC.msg = null; renderSheet();
  try{ const u = await sb("/auth/v1/user"); if(u) ACC.session.user = u, authSave(ACC.session); }catch(_){}
  toast(msg);
  try{ await pullState(); }catch(_){ render(); }
}
async function accSignOut(){
  try{ await sb("/auth/v1/logout", {method:"POST"}); }catch(_){}
  setSession(null); ACC.sheet = null; renderSheet(); render(); toast("Signed out. Everything stays on this device.");
}
async function accDelete(){
  if(!ACC.delArm){ ACC.delArm = true; renderSheet(); setTimeout(()=>{ ACC.delArm = false; renderSheet(); }, 5000); return; }
  ACC.busy = true; renderSheet();
  try{ await sb("/rest/v1/rpc/delete_me", {method:"POST", body:{}}); setSession(null); ACC.sheet = null; toast("Account deleted. Your data on this device is untouched."); }
  catch(e){ ACC.msg = friendly(e); ACC.msgKind = "err"; }
  ACC.busy = false; ACC.delArm = false; renderSheet(); render();
}

/* ---------- startup: restore a saved session, or finish an email link (confirm / reset) ---------- */
async function accInit(){
  if(!accountsOn()) return;
  const hash = new URLSearchParams(location.hash.slice(1));
  if(hash.get("access_token")){
    const type = hash.get("type");
    setSession({access_token: hash.get("access_token"), refresh_token: hash.get("refresh_token"), expires_in: +hash.get("expires_in") || 3600});
    history.replaceState(null, "", location.pathname + location.search);
    try{ ACC.session.user = await sb("/auth/v1/user"); authSave(ACC.session); }catch(_){}
    if(type === "recovery"){ ACC.sheet = "newpw"; ACC.msg = "Choose a new password for " + accName() + "."; ACC.msgKind = "info"; renderSheet(); }
    else toast("Email confirmed. Your command center now follows you.");
    try{ await pullState(); }catch(_){}
    return;
  }
  if(hash.get("error_description")){ history.replaceState(null, "", location.pathname + location.search); toast(hash.get("error_description").replace(/\+/g," ")); }
  const saved = authLoad();
  if(saved && saved.access_token){ ACC.session = saved; await sbRefresh(); if(ACC.session){ try{ await pullState(); }catch(_){} } render(); }
}

/* ---------- what locks next ---------- */
function lockMap(){
  if(S._lockAt === S.loadedAt && S._lockKick === !!(S.kick[S.week] && S.kick[S.week].ok) && S._lockDone === JSON.stringify(doneList())) return S._locks;
  const m = {};
  const put = (lid, k, kind) => { if(!k || k.ts <= Date.now()) return; const e = m[lid]; if(!e || k.ts < e.k.ts) m[lid] = {k, kind}; };
  for(const g of outGroups()) for(const x of g.rows) if(!isDone(x.r.league.league_id)) put(x.r.league.league_id, x.dl, "fix");
  for(const r of S.results){ if(r.sev === "off" || isDone(r.league.league_id)) continue;
    if(r.issues.some(x=>x.sev === "warn")) put(r.league.league_id, resDeadline(r, "monitor"), "monitor");
    if(r.moves && r.gain > 0) put(r.league.league_id, resDeadline(r, "startsit"), "startsit"); }
  S._locks = m; S._lockAt = S.loadedAt; S._lockKick = !!(S.kick[S.week] && S.kick[S.week].ok); S._lockDone = JSON.stringify(doneList());
  return m;
}
function doneList(){ return S.results.filter(r=>isDone(r.league.league_id)).map(r=>r.league.league_id); }
function nextLock(){
  const all = Object.values(lockMap()).sort((a,b)=>a.k.ts - b.k.ts);
  if(!all.length) return null;
  const first = all[0], same = all.filter(e=>e.k.ts - first.k.ts < 3.6e6);
  return {k:first.k, n:same.length, fix:same.filter(e=>e.kind === "fix").length, total:all.length};
}
const hoursTo = ts => (ts - Date.now())/3.6e6;

/* ---------- offers you've sent, tracked on this device ---------- */
const OFFERS = { all(){ return store.get("offers", []); }, save(a){ store.set("offers", a.slice(0, 120)); } };
function addOffer(o){
  const a = OFFERS.all(), key = o.lid + "|" + o.give.join("+") + ">" + o.get.join("+"), ex = a.find(z=>z.key === key);
  if(ex){ ex.ts = Date.now(); ex.status = "sent"; } else a.unshift({...o, key, ts: Date.now(), status: "sent"});
  OFFERS.save(a);
}
function offerStats(){
  const a = OFFERS.all(), waiting = a.filter(o=>o.status === "sent"), nudge = waiting.filter(o=>Date.now() - o.ts > 2*864e5);
  const done = a.filter(o=>["accepted","declined"].includes(o.status)), acc = a.filter(o=>o.status === "accepted").length;
  return {all:a, waiting:waiting.length, nudge:nudge.length, countered:a.filter(o=>o.status === "countered").length, acc, rate: done.length ? acc/done.length : null};
}

    direction: ()=> lg ? {icon:"diagnose", label:`Contend or rebuild in ${lg.name}?`, detail:"Playoff odds, roster window and the data's call", run:()=>go("team", {lid:lg.league_id})}
      : {icon:"diagnose", label:"Diagnose every team", detail:"Playoff and bubble odds, and the right lane for each team", run:()=>go("direction")},
    waivers: ()=>({icon:"waivers", label:`Waivers${pos ? `: best ${pos} adds` : ""}`, detail:"Holes to fill, stashes, and what to bid", run:()=>go("waivers")}),
    rankings: ()=>{ const mode = T(/\b(this week|week \d+|start)\b/) ? "week" : T(/\b(rest of (the )?season|ros|redraft)\b/) ? "ros" : T(/\bdynasty|long[- ]?term\b/) ? "dyn" : (T(/riser|faller|trending|mover/) ? "dyn" : RK.mode);
      const mv = T(/\b(fallers?|down|sell high|dropping)\b/) ? "fall" : T(/\b(risers?|trending|movers?|buy low|up|rising)\b/) ? "rise" : "rank";
      const lbl = {week:`Week ${S.week}`, ros:"Rest of season", dyn:"Dynasty"}[mode];
      return {icon:"rankings", label:`${A ? `${A.name} in the ` : ""}${pos || (A && A.pos) || "Overall"} rankings · ${lbl}${mv === "rise" ? " · 30-day risers" : mv === "fall" ? " · 30-day fallers" : ""}`, detail: A ? "Tier, value, production and why he's ranked there" : "Tiers, 30-day movers and the case for each player",
        run:()=>{ RK.mode = mode; store.set("rk:mode", mode); RK.pos = pos || (A && A.pos) || "ALL"; RK.sort = mv; RK.q = ""; RK.open = A ? A.id : null; go("rankings", A ? {anchor:"rk-"+A.id} : {}); }}; },
    exposure: ()=> A ? {icon:"exposure", label:`Where you have ${A.name}`, detail:`On ${ownedIn(A.id).length} of your rosters · start/sit in each`, run:()=>{ S.ptab = "exposure"; S.query = A.name; S.playerFilter = "all"; go("players"); }}
      : team ? {icon:"exposure", label:`Your ${team} players`, detail:"Every league you start or roster them", run:()=>{ S.ptab = "exposure"; S.query = team; S.playerFilter = "all"; go("players"); }}
      : {icon:"exposure", label:"Your exposure", detail:"Who you own across every league", run:()=>{ S.ptab = "exposure"; S.query = ""; go("players"); }},
    brief: ()=>({icon:"brief", label:`Week ${S.week} brief`, detail:"The story of your week, before kickoff", run:()=>go("brief")}),
    market: ()=> A ? {icon:"market", label:`What ${A.name} has cost`, detail:"Real trades in your leagues this season", run:()=>{ S.mq = A.name; go("trades", {anchor:"market"}); }}
      : {icon:"market", label:"Trade market", detail:"Search what players actually cost", run:()=>go("trades", {anchor:"market"})},
    offers: ()=>{ const o = offerStats(); return {icon:"offers", label:"Your offers", detail: o.all.length ? `${o.waiting} waiting · ${o.nudge} need a nudge` : "Nothing tracked yet", run:()=>go("offers")}; },
    team: ()=> lg ? {icon:"team", label:`Open ${lg.name}`, detail:"Roster, direction and trade recs", run:()=>go("team", {lid:lg.league_id})} : null,
    help: ()=>[{icon:"rankings", label:`Find "${t}" in rankings`, detail:"Search every ranked player", run:()=>{ RK.q = t; go("rankings"); }},
      {icon:"orb", label:"Open the crystal ball", detail:"Start/Sit, trade check and compare", run:()=>go("ask")}]
  };
  for(const k of Object.keys(sc)) push(k, B_[k] && B_[k]());
  // a named league is always one tap away
  if(lg && !out.some(o=>o.key === "team" || o.key === "finder" || o.key === "direction")) push("team", Object.assign(B_.team(), {}));
  const seen = new Set(), list = out.filter(o=>o && o.label && !seen.has(o.label) && seen.add(o.label)).sort((a,b)=>b.score - a.score);
  const chips = P.map(p=>`<span>${esc(p.name)}${p.pos ? ` · ${p.pos}` : ""}${p.team ? ` ${p.team}` : ""}</span>`).concat(lg ? [`<span class="lg">${esc(lg.name)}</span>`] : [], pos ? [`<span class="lg">${pos}</span>`] : [], team && !P.length ? [`<span class="lg">${team}</span>`] : []);
  return {list, chips, players:P, league:lg, pos, team};
}
function askFromText(text){
  const t = (text||"").trim();
  hideDrop();
  if(!t){ go("ask"); return; }
  const I = interpret(t), sel = S.dropSel && S.dropFor === t ? S.dropSel : 0, it = I.list[sel] || I.list[0];
  const rec = store.get("recentAsk", []).filter(x=>x !== t); rec.unshift(t); store.set("recentAsk", rec.slice(0, 5));
  const q = $("askq"); if(q){ q.value = ""; q.blur(); }
  if(!it){ go("ask"); return; }
  showToast(it.label);
  it.run();
}
function hideDrop(){ const d = $("askdrop"); if(d) d.hidden = true; S.dropSel = 0; }
function updateDrop(){
  const q = $("askq"), d = $("askdrop"); if(!q || !d) return;
  if(document.activeElement !== q || !S.results.length){ d.hidden = true; return; }
  const t = q.value.trim();
  if(!t){
    const recent = store.get("recentAsk", []), ideas = promptIdeas().slice(0, 3);
    S.dropIntents = []; S.dropFor = "";
    d.innerHTML = `<div class="lab">Try</div>${ideas.map(x=>`<button class="drow" data-ask="${esc(x)}">${svgI("orb",18)}<span class="t"><b>${esc(x)}</b></span></button>`).join("")}
      ${recent.length ? `<div class="lab">Recent</div>${recent.map(x=>`<button class="drow" data-ask="${esc(x)}">${svgI("monitor",18)}<span class="t"><b>${esc(x)}</b></span></button>`).join("")}` : ""}
      <div class="dhint">Name a player, team, league or position, and say what you want: start, trade, sell, rank, waivers… Spin the ball or shake your phone to ask.</div>`;
    d.hidden = false; return;
  }
  const I = interpret(t); S.dropIntents = I.list; if(S.dropFor !== t){ S.dropSel = 0; S.dropFor = t; }
  d.innerHTML = (I.chips.length ? `<div class="dchips"><small>Heard</small>${I.chips.join("")}</div>` : "") +
    I.list.slice(0, 5).map((it,i)=>`<button class="drow${i === (S.dropSel||0) ? " sel" : ""}" data-intent="${i}">${svgI(it.icon,18)}<span class="t"><b>${esc(it.label)}</b><small>${esc(it.detail)}</small></span>${i === (S.dropSel||0) ? `<kbd>↵</kbd>` : ""}</button>`).join("");
  d.hidden = false;
}

/* ---------- spin the ball, shake the phone ---------- */
const SHAKE = {on: store.get("shake", true), last:0, hits:[], px:null, asked:false};
function motionOK(){
  try{ if(SHAKE.asked || !SHAKE.on) return; if(typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function"){ SHAKE.asked = true; DeviceMotionEvent.requestPermission().catch(()=>{}); } }catch(e){}
}
function spinMini(dir=1){ const m = $("miniOrb"); if(!m || reduceMotion()) return;
  m.animate([{transform:"rotate(0) scale(1)"},{transform:`rotate(${dir*560}deg) scale(1.28)`, offset:.6},{transform:`rotate(${dir*720}deg) scale(1)`}], {duration:640, easing:"cubic-bezier(.22,1,.36,1)"}); }
function burstOrb(){ ORB.boost = 1; ORB.pulse = .6; ORB.shock = {x:.5, y:.47}; setTimeout(()=>{ ORB.boost = 0; }, 900); }
function askNow(source){
  haptic();
  if(currentView() === "ask"){ burstOrb();
    if(cbReady() && !S.thinking){ cbAsk(); return; }
    showToast(TOOL.mode === "trade" ? "Add a player to each side, then spin" : "Pick two players, then spin the ball"); return; }
  const q = $("askq");
  if(q && q.value.trim()){ spinMini(); const v = q.value; setTimeout(()=>askFromText(v), reduceMotion() ? 0 : 480); return; }
  if(source === "shake"){ go("ask"); setTimeout(burstOrb, 120); }
}
window.addEventListener("orbspin", ()=>askNow("spin"));
window.addEventListener("devicemotion", e=>{
  if(!SHAKE.on) return; const a = e.accelerationIncludingGravity || e.acceleration; if(!a || a.x == null) return;
  const p = SHAKE.px; SHAKE.px = {x:a.x, y:a.y, z:a.z}; if(!p) return;
  const d = Math.abs(a.x-p.x) + Math.abs(a.y-p.y) + Math.abs(a.z-p.z), now = Date.now();
  if(d > 24){ SHAKE.hits = SHAKE.hits.filter(t=>now - t < 800); SHAKE.hits.push(now);
    if(SHAKE.hits.length >= 3 && now - SHAKE.last > 2200 && S.results.length){ SHAKE.last = now; SHAKE.hits = []; askNow("shake"); } }
});
let MO = null;
document.addEventListener("pointerdown", e=>{ const m = e.target.closest("#miniOrb"); if(!m) return; MO = {x:e.clientX, el:m, dx:0}; try{ m.setPointerCapture(e.pointerId); }catch(_){} motionOK(); });
document.addEventListener("pointermove", e=>{ if(!MO) return; MO.dx = e.clientX - MO.x; MO.el.style.transform = `rotate(${MO.dx*5}deg) scale(1.1)`; }, {passive:true});
document.addEventListener("pointerup", ()=>{ if(!MO) return; const m = MO; MO = null; m.el.style.transform = "";
  const q = $("askq"), flick = Math.abs(m.dx) > 22;
  if(q && q.value.trim()){ spinMini(m.dx < 0 ? -1 : 1); const v = q.value; setTimeout(()=>askFromText(v), reduceMotion() ? 0 : 480); }
  else if(flick){ spinMini(m.dx < 0 ? -1 : 1); setTimeout(()=>go("ask"), 380); }
  else if(q) q.focus(); });
document.addEventListener("pointerdown", e=>{ if(e.target.id === "orb") motionOK(); }, {passive:true});

/* ---------- wiring ---------- */
document.addEventListener("click", e=>{
  if(e.target.closest("#menuBtn")){ MENU.open ? closeMenu() : openMenu(); return; }
  if(e.target.classList && e.target.classList.contains("scrim")){ closeMenu(); return; }
  if(e.target.closest("#mRefresh")){ closeMenu(); $("refresh").click(); return; }
  if(e.target.closest("#mSwitch")){ closeMenu(); S.userId = null; S.results = []; S.displayName = ""; S.error = null; S.bp = null; S.sim = {}; S.brief = {}; S.dir = null; S.lastKey = null; render(); return; }
  const it = e.target.closest("[data-intent]"); if(it){ const k = +it.dataset.intent, x = (S.dropIntents||[])[k]; const q = $("askq");
    if(x){ const t = q ? q.value.trim() : ""; if(t){ const rec = store.get("recentAsk", []).filter(z=>z !== t); rec.unshift(t); store.set("recentAsk", rec.slice(0,5)); }
      if(q){ q.value = ""; q.blur(); } hideDrop(); showToast(x.label); x.run(); } return; }
  const nv = e.target.closest("[data-nav]"); if(nv){ const [v, arg] = nv.dataset.nav.split(":");
    if(v === "players"){ S.ptab = arg; go("players"); }
    else if(v === "trades"){ go("trades", {anchor: arg}); setTimeout(()=>{ const m = $("mq"); if(m && arg === "market") m.focus({preventScroll:true}); }, 400); }
    return; }
  const ofs = e.target.closest("[data-ofs]"); if(ofs){ const i = ofs.dataset.ofs.lastIndexOf("|"), key = ofs.dataset.ofs.slice(0,i), st = ofs.dataset.ofs.slice(i+1);
    const a = OFFERS.all(), x = a.find(z=>z.key === key); if(x){ x.status = st; x.ts = Date.now(); OFFERS.save(a); } render(); return; }
  const ofr = e.target.closest("[data-ofrm]"); if(ofr){ OFFERS.save(OFFERS.all().filter(z=>z.key !== ofr.dataset.ofrm)); render(); return; }
  const dlf = e.target.closest("[data-dlf]"); if(dlf){ S.dirFilter = dlf.dataset.dlf || null; render(); return; }
  const dr = e.target.closest("[data-dir]"); if(dr){ go("team", {lid: dr.dataset.dir}); return; }
  if(e.target.closest("#shakeT")){ SHAKE.on = !SHAKE.on; store.set("shake", SHAKE.on); if(SHAKE.on){ SHAKE.asked = false; motionOK(); } render(); return; }
}, true);
document.addEventListener("input", e=>{
  if(e.target.id === "askq"){ updateDrop(); return; }
  if(e.target.id === "mq2"){ MENU.q = e.target.value; renderMenu(); return; }
  if(e.target.id === "mq"){ S.mq = e.target.value; render(); return; }
});
document.addEventListener("focusin", e=>{ if(e.target.id === "askq"){ updateDrop(); $("top").classList.remove("tuck"); } });
document.addEventListener("focusout", e=>{ if(e.target.id === "askq") setTimeout(()=>{ if(document.activeElement !== $("askq")) hideDrop(); }, 160); });
document.addEventListener("keydown", e=>{
  if(e.key === "Escape"){ if(MENU.open){ closeMenu(); $("menuBtn").focus(); return; } const q = $("askq"); if(q && document.activeElement === q){ q.blur(); hideDrop(); } return; }
  if(e.target.id === "askq" && (e.key === "ArrowDown" || e.key === "ArrowUp") && (S.dropIntents||[]).length){ e.preventDefault();
    const n = Math.min(5, S.dropIntents.length); S.dropSel = ((S.dropSel||0) + (e.key === "ArrowDown" ? 1 : -1) + n) % n; updateDrop(); }
});
{ const d = $("askdrop"); if(d){ d.addEventListener("mousedown", e=>e.preventDefault()); d.addEventListener("pointerdown", e=>{ if(e.pointerType === "mouse") e.preventDefault(); }); } }
let lastY = 0;
window.addEventListener("scroll", ()=>{ const y = window.scrollY, top = $("top"); if(!top) return;
  if(document.activeElement !== $("askq")){ if(y > 140 && y > lastY + 6) top.classList.add("tuck"); else if(y < lastY - 6 || y < 140) top.classList.remove("tuck"); }
  lastY = y; }, {passive:true});

SPACE.init();
ORB.init();
if(S.username) S.loading = true;
render();
startup();
accInit();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

</script>
</body>
