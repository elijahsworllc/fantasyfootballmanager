<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1520">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Command Center">
<title>Lineup Command Center</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column, sticky scoreboard header, severity-striped league cards. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#E4E8ED; --ink:#121821; --muted:#5A6573; --line:#D3D9E0;
  --accent:#0E8FA3; --accent-ink:#FFFFFF;
  --crit:#D93A3F; --warn:#C27A06; --up:#0E8FA3; --ok:#2E9A57; --info:#6B7684;
  --crit-bg:#FBE9E9; --warn-bg:#FBF1DE; --up-bg:#E2F3F5; --ok-bg:#E5F4EA;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1118; --surface:#141C26; --sunk:#0F161F; --ink:#E8EDF2; --muted:#93A0AE; --line:#243140;
  --accent:#3CC4D6; --accent-ink:#06222A;
  --crit:#F26468; --warn:#E9A93A; --up:#3CC4D6; --ok:#4CC27A; --info:#8592A0;
  --crit-bg:#341A1E; --warn-bg:#33270F; --up-bg:#0F2D33; --ok-bg:#12291C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1118; --surface:#141C26; --sunk:#0F161F; --ink:#E8EDF2; --muted:#93A0AE; --line:#243140;
  --accent:#3CC4D6; --accent-ink:#06222A;
  --crit:#F26468; --warn:#E9A93A; --up:#3CC4D6; --ok:#4CC27A; --info:#8592A0;
  --crit-bg:#341A1E; --warn-bg:#33270F; --up-bg:#0F2D33; --ok-bg:#12291C; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}

/* Header */
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.hrow{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1;flex:1;min-width:0}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.wk button{background:none;border:0;width:32px;height:34px;cursor:pointer;font-size:16px;color:var(--muted)}
.wk span{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;min-width:58px;text-align:center}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:8px;height:36px;padding:0 12px;cursor:pointer;font-weight:600;font-size:13px}
.iconbtn:focus-visible,.wk button:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Scoreboard */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-block:4px 12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--display);font-size:30px;line-height:1;font-weight:700}
.tile span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
.tile.crit b{color:var(--crit)} .tile.warn b{color:var(--warn)} .tile.up b{color:var(--up)} .tile.ok b{color:var(--ok)}
.tile[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

.tabs{display:flex;gap:4px;padding-bottom:8px}
.tab{flex:1;background:none;border:0;border-radius:8px;padding:8px 0;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}

main{padding-block:14px 48px;display:flex;flex-direction:column;gap:12px}
.status{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar{height:3px;background:var(--sunk);border-radius:2px;overflow:hidden;flex-basis:100%}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

/* Setup */
.setup{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.setup h2{font-family:var(--display);font-size:26px;margin:0;text-transform:uppercase;letter-spacing:.02em}
.setup p{margin:0;color:var(--muted);max-width:60ch}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 12px;font-size:16px}
.primary{height:44px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:0 18px;cursor:pointer}

/* League card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--sev,var(--line))}
.card.s-crit{--sev:var(--crit)} .card.s-warn{--sev:var(--warn)} .card.s-up{--sev:var(--up)} .card.s-ok{--sev:var(--ok)} .card.s-info{--sev:var(--info)}
.card.done{opacity:.55}
.chead{display:flex;gap:10px;align-items:flex-start;padding:12px 14px 8px 18px}
.chead .t{flex:1;min-width:0}
.lname{font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.score{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.score .num{display:block;font-size:14px;color:var(--ink)}
.issues{list-style:none;margin:0;padding:0 14px 10px 18px;display:flex;flex-direction:column;gap:6px}
.issue{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.pill{flex:none;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 6px;margin-top:2px}
.p-crit{background:var(--crit-bg);color:var(--crit)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-up{background:var(--up-bg);color:var(--up)} .p-info{background:var(--sunk);color:var(--info)} .p-ok{background:var(--ok-bg);color:var(--ok)}
.issue .txt{min-width:0;overflow-wrap:anywhere}
.moves{margin:0 14px 10px 18px;border-radius:8px;background:var(--sunk);padding:8px 10px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;font-size:13px;align-items:baseline}
.moves .lab{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.moves .in{color:var(--ok)} .moves .out{color:var(--crit)}
.moves .gain{grid-column:1/-1;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:4px;margin-top:2px}
.cfoot{display:flex;gap:8px;padding:0 14px 12px 18px;flex-wrap:wrap}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.ghost.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}

/* Lineup table */
.lineup{margin:0 14px 12px 18px;overflow-x:auto}
.lineup table{width:100%;border-collapse:collapse;font-size:13px}
.lineup th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
.lineup td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.lineup td.slot{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.03em;color:var(--muted);white-space:nowrap}
.lineup tr.chg td{background:var(--up-bg)}
.lineup .pr{text-align:right;white-space:nowrap}
.tag{font-size:10px;font-weight:700;border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:1px}
.t-Q{background:var(--warn-bg);color:var(--warn)} .t-X{background:var(--crit-bg);color:var(--crit)} .t-L{background:var(--sunk);color:var(--muted)}

/* Compact list */
.row{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 18px;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--sev,var(--line))}
.row .lname{flex:1;font-weight:500}

/* Players */
.search{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 14px;font-size:16px;width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plist{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.prow{padding:10px 14px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.ptop{display:flex;gap:8px;align-items:baseline}
.ptop .nm{flex:1;font-weight:600;min-width:0}
.ptop .pos{font-size:12px;color:var(--muted)}
.pstat{font-size:12px;color:var(--muted);margin-top:2px}
.pleagues{margin:6px 0 0;padding:0;list-style:none;font-size:13px;display:flex;flex-direction:column;gap:2px}
.pleagues li{display:flex;gap:8px}
.pleagues li span:first-child{flex:1;min-width:0;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--muted);padding:28px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.err{background:var(--crit-bg);color:var(--crit);border-radius:10px;padding:12px 14px;font-size:14px}
.note{font-size:12px;color:var(--muted);max-width:65ch}
details.settings{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.settings summary{cursor:pointer;font-weight:600}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:10px;font-size:14px}
.srow select,.srow input[type=text]{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;min-width:0}
@media (max-width:420px){.tile b{font-size:26px}.tile span{font-size:10px;letter-spacing:.03em}.brand{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hrow">
      <div class="brand">Command Center<small id="sub">Lineups across every league</small></div>
      <div class="wk" id="wkctl" hidden>
        <button id="wkprev" aria-label="Previous week">‹</button><span id="wklabel">WK –</span><button id="wknext" aria-label="Next week">›</button>
      </div>
      <button class="iconbtn" id="refresh" hidden>Refresh</button>
    </div>
    <div class="board" id="board" hidden>
      <button class="tile crit" data-f="crit" aria-pressed="false"><b id="c-crit">0</b><span>Must fix</span></button>
      <button class="tile warn" data-f="warn" aria-pressed="false"><b id="c-warn">0</b><span>Check</span></button>
      <button class="tile up" data-f="up" aria-pressed="false"><b id="c-up">0</b><span>Upgrades</span></button>
      <button class="tile ok" data-f="ok" aria-pressed="false"><b id="c-ok">0</b><span>Set</span></button>
    </div>
    <div class="tabs" role="tablist" id="tabs" hidden>
      <button class="tab" role="tab" data-tab="queue" aria-selected="true">Action queue</button>
      <button class="tab" role="tab" data-tab="leagues" aria-selected="false">All leagues</button>
      <button class="tab" role="tab" data-tab="players" aria-selected="false">Players</button>
    </div>
  </div>
</header>
<main class="wrap" id="main"></main>

<script>
"use strict";
const API = "https://api.sleeper.app";
const OUT_STATUSES = new Set(["Out","IR","PUP","Sus","NA","DNR","COV"]);
const FACTOR = {Out:0, IR:0, PUP:0, Sus:0, NA:0, DNR:0, COV:0, Doubtful:0.2, Questionable:0.85};
const SLOT_ELIG = {QB:["QB"],RB:["RB"],WR:["WR"],TE:["TE"],K:["K"],DEF:["DEF"],FLEX:["RB","WR","TE"],
  WRRB_FLEX:["RB","WR"],REC_FLEX:["WR","TE"],SUPER_FLEX:["QB","RB","WR","TE"],DL:["DL"],LB:["LB"],DB:["DB"],IDP_FLEX:["DL","LB","DB"]};
const SLOT_LABEL = {SUPER_FLEX:"SFLX",FLEX:"FLEX",WRRB_FLEX:"W/R",REC_FLEX:"W/T",IDP_FLEX:"IDP"};
const SKIP_STAT = /^(adp_|pos_adp_|pts_std$|pts_ppr$|pts_half_ppr$|gp$|cmp_pct$|rec_tgt$)/;
const SEV_RANK = {crit:0,warn:1,up:2,info:3,ok:4,off:5};

/* ---------- storage (per-device conveniences) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("cc:"+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("cc:"+k, JSON.stringify(v)); }catch(e){} }
};

const S = {
  username: store.get("username",""),
  threshold: store.get("threshold", 1.5),
  hideDone: store.get("hideDone", false),
  tab: "queue", filter: null, playerFilter: "all", query: "",
  season: null, nflWeek: null, week: null, userId: null, displayName: "",
  leagues: [], results: [], proj: {}, sched: {}, loading: false, progress: 0, error: null, loadedAt: null,
  expanded: new Set()
};

/* ---------- fetch helpers ---------- */
async function getJSON(path){
  const r = await fetch(path.startsWith("http") ? path : API + path);
  if(!r.ok) throw new Error("Sleeper returned " + r.status + " for " + path.split("?")[0]);
  return r.json();
}
async function pool(items, n, fn){
  const out = new Array(items.length); let i = 0;
  async function worker(){ while(i < items.length){ const k = i++; try{ out[k] = await fn(items[k], k); }catch(e){ out[k] = {error:String(e.message||e)}; } } }
  await Promise.all(Array.from({length:Math.min(n, items.length)}, worker));
  return out;
}

/* ---------- scoring ---------- */
function leagueScore(stats, sc, pos){
  if(!stats) return 0;
  let t = 0;
  for(const k in stats){ if(SKIP_STAT.test(k)) continue; const w = sc[k]; if(w) t += w * stats[k]; }
  // kickers: projections use 50+ buckets that some leagues split into 50-59 / 60+
  if(stats.fgm_50p && sc.fgm_50p == null && sc.fgm_50_59) t += sc.fgm_50_59 * stats.fgm_50p;
  const rec = stats.rec || 0;
  if(rec){
    if(pos==="TE" && sc.bonus_rec_te && stats.bonus_rec_te==null) t += sc.bonus_rec_te*rec;
    if(pos==="WR" && sc.bonus_rec_wr && stats.bonus_rec_wr==null) t += sc.bonus_rec_wr*rec;
    if(pos==="RB" && sc.bonus_rec_rb && stats.bonus_rec_rb==null) t += sc.bonus_rec_rb*rec;
  }
  return t;
}

/* ---------- schedule ---------- */
function weekdayOf(date){ if(!date) return ""; const d = new Date(date+"T12:00:00"); return d.toLocaleDateString(undefined,{weekday:"short"}); }
function buildSched(all, week){
  const byTeam = {};
  for(const g of all){ if(g.week !== week) continue;
    for(const t of [g.home, g.away]) byTeam[t] = {date:g.date, status:g.status, opp: t===g.home ? g.away : "@"+g.home};
  }
  return byTeam;
}

/* ---------- player info per league ---------- */
function pinfo(pid, league){
  if(!pid || pid === "0") return null;
  const e = S.proj[pid]; const p = e && e.player || {};
  const pos = p.position || (isNaN(+pid) ? "DEF" : "?");
  const team = p.team || (isNaN(+pid) ? pid : null);
  const name = p.first_name ? (pos==="DEF" ? (p.last_name || p.first_name) : p.first_name[0] + ". " + p.last_name) : (pos==="DEF" ? pid + " D/ST" : "Player " + pid);
  const full = p.first_name ? (p.first_name + " " + (p.last_name||"")).trim() : name;
  const g = team ? S.sched[team] : null;
  const status = p.injury_status || null;
  let reason = null;
  if(!team) reason = "Not on an NFL team";
  else if(!g) reason = "Bye week";
  else if(g.status === "canceled") reason = "Game canceled";
  const locked = !!(g && (g.status === "complete" || g.status === "in_game"));
  const raw = e && e.stats ? leagueScore(e.stats, league.scoring_settings || {}, pos) : 0;
  let eff = raw * (status && FACTOR[status] != null ? FACTOR[status] : 1);
  if(reason) eff = 0;
  return {pid, name, full, pos, elig: p.fantasy_positions && p.fantasy_positions.length ? p.fantasy_positions : [pos], team, status, reason, locked, raw, eff, game:g};
}

/* ---------- optimizer ---------- */
function optimize(slots, current, poolIds, info){
  const assign = new Array(slots.length).fill(null); const used = new Set();
  slots.forEach((s,i)=>{ const p = current[i]; if(p && p!=="0" && info(p) && info(p).locked){ assign[i]=p; used.add(p); } });
  const cands = poolIds.filter(p=>!used.has(p) && info(p) && !info(p).locked);
  const order = slots.map((s,i)=>i).filter(i=>assign[i]===null)
    .sort((a,b)=>(SLOT_ELIG[slots[a]]||[]).length - (SLOT_ELIG[slots[b]]||[]).length);
  for(const i of order){
    const elig = SLOT_ELIG[slots[i]]; if(!elig){ assign[i] = current[i] && current[i]!=="0" ? current[i] : null; if(assign[i]) used.add(assign[i]); continue; }
    let best = null, bestV = -1;
    for(const p of cands){ if(used.has(p)) continue; const f = info(p); if(!f.elig.some(x=>elig.includes(x))) continue;
      const v = f.eff + (p === current[i] ? 0.001 : 0);
      if(v > bestV){ bestV = v; best = p; } }
    if(best){ assign[i] = best; used.add(best); }
  }
  return assign;
}

/* ---------- analyze one league ---------- */
function analyze(league, roster, matchups){
  const res = {league, roster, issues:[], sev:"ok", moves:null, gain:0, firstGame:null};
  const info = pid => pid && pid!=="0" ? (res._c[pid] ||= pinfo(pid, league)) : null; res._c = {};
  const set = league.settings || {};
  if(league.status !== "in_season"){ res.sev = "off"; res.issues.push({sev:"info", text: "League is " + (league.status||"not active").replace(/_/g," ")}); return res; }
  if(set.best_ball === 1){ res.sev = "off"; res.bestBall = true; res.issues.push({sev:"info", text:"Best ball — Sleeper sets this lineup for you"}); return res; }
  if(!roster){ res.sev = "off"; res.issues.push({sev:"info", text:"No team found for you in this league"}); return res; }

  const slots = league.roster_positions.filter(p=>p!=="BN");
  const current = (roster.starters || []).slice(0, slots.length);
  while(current.length < slots.length) current.push("0");
  const reserve = new Set(roster.reserve || []), taxi = new Set(roster.taxi || []);
  const active = (roster.players || []).filter(p=>!reserve.has(p) && !taxi.has(p));
  res.slots = slots; res.current = current;
  const autoSubs = set.max_subs || 0;

  // starter checks
  current.forEach((pid,i)=>{
    const slot = SLOT_LABEL[slots[i]] || slots[i];
    if(!pid || pid==="0"){ res.issues.push({sev:"crit", text:`Empty ${slot} slot`}); return; }
    const f = info(pid); if(f.locked) return;
    const day = f.game ? weekdayOf(f.game.date) : "";
    if(f.reason) res.issues.push({sev:"crit", text:`${f.full} — ${f.reason.toLowerCase()}`, date: f.game && f.game.date});
    else if(OUT_STATUSES.has(f.status)) res.issues.push({sev:"crit", text:`${f.full} is ${f.status === "IR" ? "on IR" : f.status}`, date:f.game.date});
    else if(f.status === "Doubtful") res.issues.push({sev:"crit", text:`${f.full} is Doubtful (${day})`, date:f.game.date});
    else if(f.status === "Questionable") res.issues.push({sev:"warn", text:`${f.full} is Questionable (${day}) · ${autoSubs ? `league allows ${autoSubs} auto-sub${autoSubs>1?"s":""}, set one in Sleeper` : "no auto-subs in this league"}`, date:f.game.date});
  });

  // optimal lineup
  const opt = optimize(slots, current, active, info);
  res.opt = opt;
  const total = arr => arr.reduce((s,p)=>s + (info(p) ? info(p).eff : 0), 0);
  const curT = total(current), optT = total(opt);
  res.projCur = curT; res.projOpt = optT; res.gain = optT - curT;
  const curSet = new Set(current), optSet = new Set(opt);
  const ins = opt.filter(p=>p && !curSet.has(p)), outs = current.filter(p=>p && p!=="0" && !optSet.has(p));
  const hasCrit = res.issues.some(x=>x.sev==="crit");
  if(ins.length && (res.gain >= S.threshold || hasCrit)){
    // pair each player coming in with the most natural player going out (same position first)
    const outsLeft = outs.map(info), pairedOuts = [];
    const insI = ins.map(info);
    for(const a of insI){
      let k = outsLeft.findIndex(b=>b.pos===a.pos);
      if(k < 0) k = outsLeft.findIndex(b=>b.elig.some(x=>a.elig.includes(x)));
      if(k < 0 && outsLeft.length) k = 0;
      pairedOuts.push(k >= 0 ? outsLeft.splice(k,1)[0] : null);
    }
    res.moves = {ins:insI, outs:pairedOuts.concat(outsLeft), gain:res.gain};
    if(!hasCrit) res.issues.push({sev:"up", text:`Better lineup available: +${res.gain.toFixed(1)} projected pts`});
  }
  if(hasCrit && !ins.length){
    const emptyFix = opt.some((p,i)=>!p);
    res.issues.push({sev:"crit", text: emptyFix ? "No eligible healthy player on the bench for an open slot. Check waivers." : "No healthy bench replacement. Check waivers."});
  }

  // IR slot: healthy player parked on IR
  for(const pid of reserve){ const f = info(pid); if(f && !f.reason && !f.status) res.issues.push({sev:"warn", text:`${f.full} is healthy but still in an IR slot. Sleeper blocks adds until he's moved.`}); }
  // open roster spots
  const open = league.roster_positions.length - active.length;
  if(open > 0) res.issues.push({sev:"info", text:`${open} open roster spot${open>1?"s":""}`});

  // matchup projection
  if(Array.isArray(matchups)){
    const me = matchups.find(m=>m.roster_id === roster.roster_id);
    const opp = me && me.matchup_id != null ? matchups.find(m=>m.matchup_id===me.matchup_id && m.roster_id!==roster.roster_id) : null;
    const side = (m, lineup) => { let s = 0; (lineup||[]).forEach((p,i)=>{ const f = info(p); if(!f) return;
      s += f.locked ? ((m.players_points||{})[p] || 0) : f.eff; }); return s; };
    if(me && opp){
      res.match = {me: side(me, current), meOpt: side(me, opt), opp: side(opp, opp.starters)};
      const z = (res.match.meOpt - res.match.opp) / 24;
      res.match.win = 1/(1+Math.exp(-1.7*z));
    }
  }
  const dates = res.issues.filter(x=>x.date).map(x=>x.date).sort();
  res.firstGame = dates[0] || null;
  res.sev = ["crit","warn","up","info"].find(s=>res.issues.some(x=>x.sev===s)) || "ok";
  if(res.sev === "info") res.sev = "ok";
  return res;
}

/* ---------- load ---------- */
async function loadAll(week){
  S.loading = true; S.error = null; S.progress = 0; render();
  try{
    if(!S.userId){
      const u = await getJSON("/v1/user/" + encodeURIComponent(S.username.trim()));
      if(!u || !u.user_id) throw new Error(`No Sleeper user named "${S.username}". Check the spelling.`);
      S.userId = u.user_id; S.displayName = u.display_name || u.username;
    }
    const st = await getJSON("/v1/state/nfl");
    S.season = st.season; S.nflWeek = st.week;
    const schedAll = await getJSON(`${API}/schedule/nfl/${st.season_type === "post" ? "post" : "regular"}/${st.season}`);
    if(week == null){
      const left = schedAll.filter(g=>g.week===st.week && g.status==="pre_game").length;
      week = left === 0 && st.week < 18 ? st.week + 1 : st.week;
    }
    S.week = week; S.sched = buildSched(schedAll, week);
    const pos = ["QB","RB","WR","TE","K","DEF","DL","LB","DB"].map(p=>"position%5B%5D="+p).join("&");
    const projP = getJSON(`${API}/projections/nfl/${S.season}/${week}?season_type=regular&${pos}`);
    const leagues = await getJSON(`/v1/user/${S.userId}/leagues/nfl/${S.season}`);
    S.leagues = leagues;
    const proj = await projP; S.proj = {}; for(const e of proj) S.proj[e.player_id] = e;
    let done = 0;
    const raw = await pool(leagues, 6, async (lg)=>{
      const [rosters, matchups] = await Promise.all([
        getJSON(`/v1/league/${lg.league_id}/rosters`),
        lg.status === "in_season" ? getJSON(`/v1/league/${lg.league_id}/matchups/${week}`).catch(()=>null) : Promise.resolve(null)
      ]);
      S.progress = ++done / leagues.length; renderStatus();
      const mine = rosters.find(r=>r.owner_id===S.userId || (r.co_owners||[]).includes(S.userId));
      return {lg, mine, matchups};
    });
    S.raw = raw.map((r,i)=> r && r.error ? {lg:leagues[i], error:r.error} : r);
    runAnalysis();
    S.loadedAt = new Date();
  }catch(e){ S.error = e.message || String(e); }
  S.loading = false; render();
}
function runAnalysis(){
  S.results = (S.raw||[]).map(x=> x.error ? {league:x.lg, sev:"off", issues:[{sev:"info", text:"Couldn't load: "+x.error}]} : analyze(x.lg, x.mine, x.matchups));
}

/* ---------- done marks ---------- */
const doneKey = id => `done:${S.season}:${S.week}:${id}`;
const isDone = id => !!store.get(doneKey(id), false);
function toggleDone(id){ store.set(doneKey(id), !isDone(id)); render(); }

/* ---------- render ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => (Math.round(n*10)/10).toFixed(1);
function statusTag(f){
  if(!f) return "";
  if(f.locked) return `<span class="tag t-L">LOCKED</span>`;
  if(f.reason) return `<span class="tag t-X">${f.reason==="Bye week"?"BYE":f.reason==="Game canceled"?"NO GAME":"FA"}</span>`;
  if(!f.status) return "";
  const cls = f.status==="Questionable" ? "t-Q" : "t-X";
  const lab = {Questionable:"Q",Doubtful:"D",Out:"OUT",IR:"IR",PUP:"PUP",Sus:"SUS",NA:"NA",DNR:"DNR",COV:"COV"}[f.status] || f.status;
  return `<span class="tag ${cls}">${lab}</span>`;
}
function counts(){
  const c = {crit:0,warn:0,up:0,ok:0};
  for(const r of S.results){ if(r.sev in c) c[r.sev]++; }
  return c;
}
function renderStatus(){
  const el = $("statusline"); if(!el) return;
  if(S.loading){ el.innerHTML = `<span>Scanning leagues… ${Math.round(S.progress*100)}%</span><div class="bar"><i style="width:${S.progress*100}%"></i></div>`; return; }
  const n = S.results.filter(r=>r.sev!=="off").length;
  const gain = S.results.reduce((s,r)=>s+(r.moves && r.gain>0 ? r.gain : 0),0);
  el.innerHTML = `<span>${n} active leagues · Week ${S.week}${S.week!==S.nflWeek?" (next)":""}</span>` +
    (gain>0 ? `<span>· <b class="num">+${fmt(gain)}</b> projected pts on your benches</span>` : "") +
    (S.loadedAt ? `<span>· Updated ${S.loadedAt.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}</span>` : "");
}
function leagueLink(id){ return `https://sleeper.com/leagues/${id}/team`; }

function cardHTML(r, full){
  const lg = r.league, id = lg.league_id, done = isDone(id);
  const rec = r.roster && r.roster.settings ? `${r.roster.settings.wins}-${r.roster.settings.losses}${r.roster.settings.ties?"-"+r.roster.settings.ties:""}` : "";
  const typ = {0:"Redraft",1:"Keeper",2:"Dynasty"}[(lg.settings||{}).type] || "";
  const sf = (lg.roster_positions||[]).includes("SUPER_FLEX") ? "SF" : "1QB";
  const m = r.match;
  let h = `<article class="card s-${r.sev}${done?" done":""}"><div class="chead"><div class="t"><div class="lname">${esc(lg.name)}</div>
    <div class="meta"><span>${typ}</span><span>${sf}</span>${rec?`<span>${rec}</span>`:""}${r.firstGame?`<span>First issue: ${weekdayOf(r.firstGame)}</span>`:""}</div></div>`;
  if(m) h += `<div class="score">Proj vs opp<span class="num">${fmt(r.moves?m.meOpt:m.me)} – ${fmt(m.opp)}</span>${Math.round(m.win*100)}% win</div>`;
  h += `</div>`;
  const iss = r.issues.filter(x=>full || x.sev!=="info" || r.issues.length===1);
  if(iss.length){ h += `<ul class="issues">` + iss.map(x=>`<li class="issue"><span class="pill p-${x.sev}">${{crit:"Fix",warn:"Check",up:"Boost",info:"Note"}[x.sev]}</span><span class="txt">${esc(x.text)}</span></li>`).join("") + `</ul>`; }
  else if(r.sev==="ok") h += `<ul class="issues"><li class="issue"><span class="pill p-ok">Set</span><span class="txt">Lineup is optimal and healthy</span></li></ul>`;
  if(r.moves){
    const rows = Math.max(r.moves.ins.length, r.moves.outs.length);
    h += `<div class="moves">`;
    for(let i=0;i<rows;i++){
      const a = r.moves.ins[i], b = r.moves.outs[i];
      h += `<span class="lab in">${a?"Start":""}</span><span>${a?`${esc(a.full)} <span class="pos">${a.pos}</span>${statusTag(a)}`:""}${b?`<br><span class="lab out">Bench</span> ${esc(b.full)} ${statusTag(b)}`:""}</span><span class="num">${a?fmt(a.eff):""}${b?`<br>${fmt(b.eff)}`:""}</span>`;
    }
    h += `<span class="gain">Net change: <span class="num">${r.moves.gain>=0?"+":""}${fmt(r.moves.gain)}</span> projected pts, scored with this league's settings</span></div>`;
  }
  if(full && r.slots) h += lineupHTML(r);
  h += `<div class="cfoot"><a class="ghost" href="${leagueLink(id)}" target="_blank" rel="noopener">Open in Sleeper ↗</a>`;
  if(r.sev!=="off") h += `<button class="ghost${done?" on":""}" data-done="${id}">${done?"Done ✓":"Mark done"}</button>`;
  if(!full && r.slots) h += `<button class="ghost" data-expand="${id}">${S.expanded.has(id)?"Hide lineup":"Show lineup"}</button>`;
  h += `</div>`;
  if(!full && S.expanded.has(id) && r.slots) h += lineupHTML(r);
  return h + `</article>`;
}
function lineupHTML(r){
  const info = p => p && p!=="0" ? r._c[p] || pinfo(p, r.league) : null;
  let h = `<div class="lineup"><table><thead><tr><th>Slot</th><th>Current</th><th class="pr">Proj</th><th>Optimal</th><th class="pr">Proj</th></tr></thead><tbody>`;
  r.slots.forEach((s,i)=>{
    const c = info(r.current[i]), o = info(r.opt[i]);
    const chg = (r.current[i]||"0") !== (r.opt[i]||"0");
    h += `<tr class="${chg?"chg":""}"><td class="slot">${SLOT_LABEL[s]||s}</td><td>${c?esc(c.name)+statusTag(c):"<i>Empty</i>"}</td><td class="pr num">${c?fmt(c.eff):"–"}</td><td>${o?esc(o.name)+statusTag(o):"<i>Empty</i>"}</td><td class="pr num">${o?fmt(o.eff):"–"}</td></tr>`;
  });
  return h + `<tr><td class="slot">Total</td><td></td><td class="pr num">${fmt(r.projCur)}</td><td></td><td class="pr num">${fmt(r.projOpt)}</td></tr></tbody></table></div>`;
}

function sorted(list){
  return list.slice().sort((a,b)=> (SEV_RANK[a.sev]-SEV_RANK[b.sev]) || ((a.firstGame||"9")<(b.firstGame||"9")?-1:(a.firstGame||"9")>(b.firstGame||"9")?1:0) || (b.gain||0)-(a.gain||0));
}

function renderQueue(){
  let list = S.results.filter(r=>r.sev!=="off");
  if(S.filter) list = list.filter(r=>r.sev===S.filter);
  else list = list.filter(r=>r.sev!=="ok");
  if(S.hideDone) list = list.filter(r=>!isDone(r.league.league_id));
  if(!list.length) return `<div class="empty">${S.filter ? "No leagues in this group." : "Every lineup is set. Nothing to fix right now."}</div>`;
  return sorted(list).map(r=>cardHTML(r,false)).join("");
}
function renderLeagues(){
  const list = sorted(S.results);
  return `<div class="plist">` + list.map(r=>{
    const id = r.league.league_id; const open = S.expanded.has(id);
    const top = r.issues.find(x=>x.sev!=="info") || r.issues[0];
    return `<div style="--sev:var(--${r.sev==="off"?"line":r.sev})" class="${isDone(id)?"done":""}"><button class="row" data-expand="${id}" aria-expanded="${open}"><span class="dot"></span><span class="lname">${esc(r.league.name)}</span><span class="pstat">${r.sev==="ok"?"Set":r.sev==="off"?(r.bestBall?"Best ball":"Inactive"):esc((top&&top.text||"").slice(0,38))}</span></button>${open?cardHTML(r,true):""}</div>`;
  }).join("") + `</div>`;
}
function exposure(){
  const map = {};
  for(const r of S.results){ if(!r.roster || r.sev==="off") continue;
    const reserve = new Set(r.roster.reserve||[]), taxi = new Set(r.roster.taxi||[]), st = new Set(r.current||[]), opt = new Set(r.opt||[]);
    for(const p of r.roster.players||[]){
      const f = r._c[p] || (r._c[p] = pinfo(p, r.league));
      const e = map[p] ||= {f, leagues:[], start:0, bench:0, wrong:0};
      const role = st.has(p) ? "Starting" : reserve.has(p) ? "IR" : taxi.has(p) ? "Taxi" : "Bench";
      if(role==="Starting") e.start++; if(role==="Bench") e.bench++;
      const shouldStart = opt.has(p);
      if((role==="Starting") !== shouldStart && role!=="IR" && role!=="Taxi" && !f.locked) e.wrong++;
      e.leagues.push({r, role, shouldStart, pts: f.eff});
    }
  }
  return Object.values(map);
}
function renderPlayers(){
  let list = exposure();
  const q = S.query.trim().toLowerCase();
  if(q) list = list.filter(e=>e.f.full.toLowerCase().includes(q) || (e.f.team||"").toLowerCase()===q);
  if(S.playerFilter==="hurt") list = list.filter(e=>e.f.status || e.f.reason);
  if(S.playerFilter==="mismatch") list = list.filter(e=>e.wrong>0);
  list.sort((a,b)=>b.leagues.length-a.leagues.length || b.f.raw-a.f.raw);
  const chips = [["all","Most rostered"],["hurt","Injured or bye"],["mismatch","Start/sit mismatch"]].map(([k,l])=>`<button class="chip" data-pf="${k}" aria-pressed="${S.playerFilter===k}">${l}</button>`).join("");
  let h = `<input class="search" id="q" type="search" placeholder="Find a player or team (e.g. Puka, KC)" value="${esc(S.query)}" autocomplete="off"><div class="chips">${chips}</div>`;
  if(!list.length) return h + `<div class="empty">No players match.</div>`;
  h += `<div class="plist">` + list.slice(0, q ? 60 : 40).map(e=>{
    const f = e.f; const g = f.game;
    const gl = f.reason ? f.reason : g ? `${weekdayOf(g.date)} ${g.opp}` : "";
    return `<div class="prow"><div class="ptop"><span class="nm">${esc(f.full)}${statusTag(f)}</span><span class="pos">${f.pos} · ${f.team||"FA"}</span><span class="num">×${e.leagues.length}</span></div>
      <div class="pstat">${esc(gl)} · starting in ${e.start}, benched in ${e.bench}${e.wrong?` · <b style="color:var(--warn)">${e.wrong} start/sit mismatch${e.wrong>1?"es":""}</b>`:""}</div>
      ${q || S.playerFilter!=="all" ? `<ul class="pleagues">${e.leagues.map(l=>`<li><span>${esc(l.r.league.name)}</span><span>${l.role}${l.role!=="IR"&&l.role!=="Taxi"&&(l.role==="Starting")!==l.shouldStart&&!f.locked?(l.shouldStart?" → start":" → sit"):""}</span><span class="num">${fmt(l.pts)}</span></li>`).join("")}</ul>` : ""}</div>`;
  }).join("") + `</div>`;
  return h;
}
function renderSetup(){
  return `<section class="setup"><h2>Every lineup, one screen</h2>
    <p>Enter your Sleeper username. The app reads your leagues straight from Sleeper's public API, scores every player with each league's own settings, and lists what needs fixing before kickoff. Nothing to log in to, nothing stored on a server.</p>
    <form class="field" id="setupform"><input id="uname" placeholder="Sleeper username" value="${esc(S.username)}" autocapitalize="off" autocorrect="off" spellcheck="false" required><button class="primary" type="submit">Scan leagues</button></form>
    ${S.error?`<div class="err">${esc(S.error)}</div>`:""}</section>`;
}
function renderSettings(){
  return `<details class="settings"><summary>Settings</summary>
    <div class="srow"><label for="thr">Flag upgrades worth at least</label><select id="thr">${[0.5,1,1.5,2,3,5].map(v=>`<option value="${v}" ${+S.threshold===v?"selected":""}>${v} pts</option>`).join("")}</select></div>
    <div class="srow"><label for="hd">Hide leagues marked done</label><input type="checkbox" id="hd" ${S.hideDone?"checked":""}></div>
    <div class="srow"><span>Signed in as <b>${esc(S.displayName||S.username)}</b></span><button class="ghost" id="switch">Switch user</button></div>
    <p class="note">Projections come from Sleeper (Rotowire) and are rescored with each league's settings. Questionable players count at 85% and Doubtful at 20% when comparing options. Sleeper doesn't share whether you've set an auto-sub, so Questionable starters stay flagged until you swap them.</p></details>`;
}
function render(){
  const ready = S.userId && (S.results.length || S.loading);
  $("wkctl").hidden = !ready; $("refresh").hidden = !ready; $("board").hidden = !ready; $("tabs").hidden = !ready;
  if(S.week) $("wklabel").textContent = "WK " + S.week;
  $("sub").textContent = S.displayName ? `${S.displayName} · ${S.season||""} season` : "Lineups across every league";
  const c = counts(); for(const k in c) $("c-"+k).textContent = c[k];
  document.querySelectorAll(".tile").forEach(t=>t.setAttribute("aria-pressed", String(S.filter===t.dataset.f)));
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", String(S.tab===t.dataset.tab)));
  const main = $("main");
  if(!ready){ main.innerHTML = S.loading ? `<div class="status" id="statusline"></div>` : renderSetup(); renderStatus(); bind(); return; }
  const focusQ = document.activeElement && document.activeElement.id==="q";
  const pos = focusQ ? document.activeElement.selectionStart : null;
  let body = `<div class="status" id="statusline"></div>`;
  if(S.error) body += `<div class="err">${esc(S.error)}</div>`;
  if(!S.loading){
    if(S.tab==="queue") body += (S.filter?`<div class="chips"><button class="chip" aria-pressed="true" id="clearf">Showing: ${{crit:"Must fix",warn:"Check",up:"Upgrades",ok:"Set"}[S.filter]} ✕</button></div>`:"") + renderQueue();
    if(S.tab==="leagues") body += renderLeagues();
    if(S.tab==="players") body += renderPlayers();
    body += renderSettings();
  }
  main.innerHTML = body; renderStatus(); bind();
  if(focusQ){ const q = $("q"); q.focus(); try{ q.setSelectionRange(pos,pos); }catch(e){} }
}
function bind(){
  const f = $("setupform");
  if(f) f.onsubmit = e=>{ e.preventDefault(); S.username = $("uname").value.trim(); if(!S.username) return; store.set("username", S.username); S.userId = null; loadAll(null); };
  document.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>toggleDone(b.dataset.done));
  document.querySelectorAll("[data-expand]").forEach(b=>b.onclick=()=>{ const id=b.dataset.expand; S.expanded.has(id)?S.expanded.delete(id):S.expanded.add(id); render(); });
  document.querySelectorAll("[data-pf]").forEach(b=>b.onclick=()=>{ S.playerFilter=b.dataset.pf; render(); });
  const q = $("q"); if(q) q.oninput = ()=>{ S.query = q.value; render(); };
  const cf = $("clearf"); if(cf) cf.onclick = ()=>{ S.filter=null; render(); };
  const thr = $("thr"); if(thr) thr.onchange = ()=>{ S.threshold=+thr.value; store.set("threshold",S.threshold); reanalyze(); };
  const hd = $("hd"); if(hd) hd.onchange = ()=>{ S.hideDone=hd.checked; store.set("hideDone",S.hideDone); render(); };
  const sw = $("switch"); if(sw) sw.onclick = ()=>{ S.userId=null; S.results=[]; S.displayName=""; S.error=null; render(); };
}
function reanalyze(){ runAnalysis(); render(); }

document.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{ S.filter = S.filter===t.dataset.f ? null : t.dataset.f; S.tab="queue"; render(); });
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{ S.tab=t.dataset.tab; render(); });
$("refresh").onclick = ()=>loadAll(S.week);
$("wkprev").onclick = ()=>{ if(S.week>1) loadAll(S.week-1); };
$("wknext").onclick = ()=>{ if(S.week<18) loadAll(S.week+1); };

render();
if(S.username) loadAll(null);
</script>
</body>
</html>
